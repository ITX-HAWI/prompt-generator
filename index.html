<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>Hawi's Arcade</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    min-height:100%; background:#F7F4EE; color:#1E1B16;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display:flex; flex-direction:column; align-items:center;
    padding:32px 18px 48px;
  }
  header { text-align:center; margin-bottom:8px; }
  header h1 {
    font-size:38px; font-weight:800; letter-spacing:10px; padding-left:10px;
    color:#1E1B16;
  }
  header .rule { width:56px; height:2px; background:#A8822F; margin:12px auto 0; }
  header p { margin-top:14px; font-size:13px; color:rgba(30,27,22,.55); letter-spacing:4px; }
  #games {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:16px; width:100%; max-width:560px; margin-top:26px;
  }
  .card {
    background:#FFFFFF;
    border:1.5px solid #E8E0D0; border-radius:16px;
    box-shadow:0 2px 12px rgba(30,27,22,0.06);
    padding:22px 12px; text-align:center; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active { transform:scale(.96); }
  .card .icon { font-size:44px; margin-bottom:10px; }
  .card h2 { font-size:17px; font-weight:800; letter-spacing:1px; margin-bottom:6px; color:#1E1B16; }
  .card p { font-size:12.5px; color:rgba(30,27,22,.55); line-height:1.4; }
  .card.locked { cursor:default; opacity:.55; }
  .card.locked:active { transform:none; }
  .badge {
    display:inline-block; margin-top:10px; font-size:11px; font-weight:800; letter-spacing:2px;
    padding:4px 12px; border-radius:20px;
  }
  .badge.play { background:#1E1B16; color:#F7F4EE; }
  .badge.soon { background:#E8E0D0; color:rgba(30,27,22,.55); }
  footer { margin-top:34px; font-size:13px; color:rgba(30,27,22,.55); letter-spacing:1px; text-align:center; }
</style>
</head>
<body>
  <header>
    <h1>HAWI'S ARCADE</h1>
    <div class="rule"></div>
    <p>PICK YOUR GAME</p>
  </header>
  <div id="games"></div>
  <footer>more games dropping soon 🎮</footer>
<script>
(function(){
  'use strict';
  var games = [
    { title:'Flappy', desc:'Tap to flap through the gates', icon:'🐤', file:'flappy.html', playable:true },
    { title:'Ludo King', desc:'The classic board game vs computer', icon:'🎲', file:'ludo.html', playable:true },
    { title:'Chess', desc:'The royal game — you vs computer', icon:'♞', file:'chess.html', playable:true },
    { title:'Breakout', desc:'Smash every brick', icon:'🧱', file:'breakout.html', playable:true },
    { title:'Block Blast', desc:'Fit the blocks, clear the lines', icon:'🧩', file:'blockblast.html', playable:true },
    { title:'3D Target Shoot', desc:'FPS bullseye range', icon:'🎯', file:'shooter3d.html', playable:true },
    { title:'Mystery Game', desc:'???', icon:'❓', file:null, playable:false }
  ];
  var wrap = document.getElementById('games');
  games.forEach(function(g){
    var card = document.createElement('div');
    card.className = 'card' + (g.playable ? '' : ' locked');
    card.innerHTML =
      '<div class="icon">'+g.icon+'</div>'+
      '<h2>'+g.title+'</h2>'+
      '<p>'+g.desc+'</p>'+
      (g.playable
        ? '<span class="badge play">PLAY</span>'
        : '<span class="badge soon">SOON</span>');
    if(g.playable){
      card.addEventListener('click', function(){ window.location.href = g.file; });
    }
    wrap.appendChild(card);
  });
})();
</script>
</body>
</html>
