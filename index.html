<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1026">
<title>Hawi's Arcade</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    min-height:100%; background:#0b1026; color:#fff;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: radial-gradient(ellipse at 50% -10%, #2b1a5e 0%, #0b1026 60%) fixed;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 18px 48px;
  }
  header { text-align:center; margin-bottom:8px; }
  header h1 {
    font-size:38px; font-weight:900; letter-spacing:4px;
    text-shadow:0 0 18px #ff2fd6, 0 0 50px #ff2fd6;
  }
  header p { margin-top:8px; font-size:15px; opacity:.7; letter-spacing:2px; }
  #games {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:16px; width:100%; max-width:560px; margin-top:26px;
  }
  .card {
    background:rgba(255,255,255,0.04);
    border:2px solid #00e5ff; border-radius:16px;
    box-shadow:0 0 18px rgba(0,229,255,.25), inset 0 0 24px rgba(0,229,255,.06);
    padding:22px 12px; text-align:center; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active { transform:scale(.96); }
  .card .icon { font-size:44px; margin-bottom:10px; }
  .card h2 { font-size:17px; font-weight:800; letter-spacing:1px; margin-bottom:6px; }
  .card p { font-size:12.5px; opacity:.65; line-height:1.4; }
  .card.locked { border-color:#555; box-shadow:none; cursor:default; opacity:.55; }
  .card.locked:active { transform:none; }
  .badge {
    display:inline-block; margin-top:10px; font-size:11px; font-weight:800; letter-spacing:2px;
    padding:4px 12px; border-radius:20px;
  }
  .badge.play { background:#39ff6a; color:#06280f; box-shadow:0 0 12px #39ff6a; }
  .badge.soon { background:#333; color:#aaa; }
  footer { margin-top:34px; font-size:13px; opacity:.5; letter-spacing:1px; text-align:center; }
</style>
</head>
<body>
  <header>
    <h1>HAWI'S ARCADE</h1>
    <p>PICK YOUR GAME</p>
  </header>
  <div id="games"></div>
  <footer>more games dropping soon 🎮</footer>
<script>
(function(){
  'use strict';
  var games = [
    { title:'Neon Flappy', desc:'Tap to flap through the neon gates', icon:'🐤', file:'flappy.html', playable:true },
    { title:'Neon Snake', desc:'Eat, grow, don\'t crash', icon:'🐍', file:null, playable:false },
    { title:'Breakout Neon', desc:'Smash every brick', icon:'🧱', file:null, playable:false },
    { title:'Mystery Game', desc:'???', icon:'❓', file:null, playable:false }
  ];
  var wrap = document.getElementById('games');
  games.forEach(function(g){
    var card = document.createElement('div');
    card.className = 'card' + (g.playable ? '' : ' locked');
    card.innerHTML =
      '<div class="icon">'+g.icon+'</div>'+
      '<h2>'+g.title+'</h2>'+
      '<p>'+g.desc+'</p>'+
      (g.playable
        ? '<span class="badge play">PLAY</span>'
        : '<span class="badge soon">SOON</span>');
    if(g.playable){
      card.addEventListener('click', function(){ window.location.href = g.file; });
    }
    wrap.appendChild(card);
  });
})();
</script>
</body>
</html>
