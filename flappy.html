<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>Flappy</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#F7F4EE; color:#1E1B16;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display:block; width:100vw; height:100vh; }
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px; color:#1E1B16; pointer-events:none;
  }
  #score { font-size:34px; font-weight:800; color:#1E1B16; }
  #best { font-size:14px; font-weight:700; letter-spacing:2px; color:rgba(30,27,22,0.55); }
  .panel {
    position:fixed; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#1E1B16; text-align:center; padding:0 24px;
    background:rgba(247,244,238,0.96);
  }
  .panel h1 {
    font-size:40px; font-weight:800; letter-spacing:10px; padding-left:10px;
    color:#1E1B16; margin-bottom:12px;
  }
  .panel .rule { width:56px; height:2px; background:#A8822F; margin:0 auto 14px; }
  .panel p { font-size:16px; color:rgba(30,27,22,0.65); margin:6px 0 4px; }
  .menuBest { font-size:15px; letter-spacing:2px; color:rgba(30,27,22,0.6); margin-bottom:18px; }
  .btn {
    display:block; width:250px; margin:8px 0; padding:14px 0 14px 4px;
    font-size:17px; font-weight:700; letter-spacing:2px; color:#1E1B16;
    background:transparent; border:1.5px solid #1E1B16; border-radius:12px;
    cursor:pointer; font-family:inherit;
    transition:transform .1s ease, background .1s ease;
  }
  .btn:active { transform:scale(.96); }
  .btn.primary { background:#1E1B16; color:#F7F4EE; }
  .btn.danger { color:#B4452F; border-color:#B4452F; }
  .tapHint { margin-top:16px; font-size:14px; letter-spacing:1px; color:rgba(30,27,22,0.6); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% {opacity:.45} 50% {opacity:1} }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="score">0</span><span id="best">BEST 0</span></div>

<div id="menu" class="panel">
  <h1>FLAPPY</h1>
  <div class="rule"></div>
  <div class="menuBest">BEST&nbsp;<span id="menuBest">0</span></div>
  <button id="btnStart" class="btn primary">&#9654;&nbsp;&nbsp;START</button>
  <button id="btnOptions" class="btn">&#9881;&nbsp;&nbsp;OPTIONS</button>
  <button id="btnExit" class="btn danger">&#10005;&nbsp;&nbsp;EXIT</button>
</div>

<div id="options" class="panel hidden">
  <h1>OPTIONS</h1>
  <div class="rule"></div>
  <div class="menuBest">&nbsp;</div>
  <button id="btnSound" class="btn">&#128266;&nbsp;&nbsp;SOUND: ON</button>
  <button id="btnDiff" class="btn">&#127919;&nbsp;&nbsp;DIFFICULTY: NORMAL</button>
  <button id="btnBack" class="btn">&larr;&nbsp;&nbsp;BACK</button>
</div>

<div id="ready" class="panel hidden">
  <h1>FLAPPY</h1>
  <div class="rule"></div>
  <p>Tap anywhere to flap through the gates</p>
  <p class="tapHint">&mdash; tap to start &mdash;</p>
</div>

<div id="over" class="panel hidden">
  <h1>GAME OVER</h1>
  <div class="rule"></div>
  <p id="finalScore"></p>
  <div class="menuBest">&nbsp;</div>
  <button id="btnRetry" class="btn primary">&#8635;&nbsp;&nbsp;RETRY</button>
  <button id="btnMenu2" class="btn">&#127968;&nbsp;&nbsp;MENU</button>
</div>

<script>
(function(){
  'use strict';

  /* ---------- DOM ---------- */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var menuBestEl = document.getElementById('menuBest');
  var panels = {
    menu: document.getElementById('menu'),
    options: document.getElementById('options'),
    ready: document.getElementById('ready'),
    over: document.getElementById('over')
  };
  var finalScoreEl = document.getElementById('finalScore');
  var btnSound = document.getElementById('btnSound');
  var btnDiff = document.getElementById('btnDiff');

  /* ---------- Settings ---------- */
  var soundOn = true, difficulty = 'normal';
  try {
    soundOn = localStorage.getItem('neonFlappySound') !== 'off';
    difficulty = localStorage.getItem('neonFlappyDiff') || 'normal';
    if(!DIFFS()[difficulty]) difficulty = 'normal';
  } catch(e){}
  function DIFFS(){
    return {
      easy:   { label:'EASY',   gap:1.20, speed:0.86 },
      normal: { label:'NORMAL', gap:1.00, speed:1.00 },
      hard:   { label:'HARD',   gap:0.85, speed:1.14 }
    };
  }
  function refreshOptionsUI(){
    btnSound.innerHTML = (soundOn ? '&#128266;' : '&#128263;') + '&nbsp;&nbsp;SOUND: ' + (soundOn ? 'ON' : 'OFF');
    btnDiff.innerHTML = '&#127919;&nbsp;&nbsp;DIFFICULTY: ' + DIFFS()[difficulty].label;
  }
  refreshOptionsUI();

  /* ---------- Audio ---------- */
  var audioCtx = null;
  function tone(freq, dur, type, vol, slideTo){
    if(!soundOn) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      var t = audioCtx.currentTime;
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    }catch(e){}
  }
  var sfx = {
    click: function(){ tone(620, 0.07, 'square', 0.05); },
    flap:  function(){ tone(420, 0.12, 'sine', 0.10, 720); },
    score: function(){ tone(880, 0.14, 'sine', 0.10, 1320); },
    die:   function(){ tone(320, 0.45, 'sawtooth', 0.10, 70); }
  };

  /* ---------- Canvas ---------- */
  var W=0, H=0, DPR=1, dust=[];
  var GROUND_H = 90, GRAV = 1900, FLAP_V = -560;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    dust = [];
    for(var i=0;i<70;i++){
      dust.push({ x:Math.random()*W, y:Math.random()*H*0.72,
                  r:Math.random()*1.8+0.4, tw:Math.random()*6.28 });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- State ---------- */
  var state='menu', bird=null, pipes=[], spawnTimer=0, score=0, best=0, time=0, groundX=0;
  try { best = parseInt(localStorage.getItem('neonFlappyBest')||'0',10)||0; } catch(e){ best=0; }
  function syncBest(){
    bestEl.textContent = 'BEST '+best;
    menuBestEl.textContent = best;
  }
  syncBest();

  function reset(){
    bird = { x: W*0.32, y: H*0.42, vy:0, r:15, rot:0 };
    pipes = []; spawnTimer=0; score=0; time=0; groundX=0;
    scoreEl.textContent='0';
  }
  reset();

  function show(name){
    for(var k in panels){ panels[k].classList.toggle('hidden', k!==name); }
  }
  function goMenu(){ state='menu'; reset(); syncBest(); show('menu'); }
  function goReady(){ state='ready'; reset(); show('ready'); }

  function speed(){ return (230 + Math.min(150, score*6)) * DIFFS()[difficulty].speed; }
  function spawnPipe(){
    var gapH = Math.max(150, Math.min(215, H*0.24)) * DIFFS()[difficulty].gap;
    var margin = 70;
    var minY = margin + gapH/2;
    var maxY = H - GROUND_H - margin - gapH/2;
    var gapY = minY + Math.random()*Math.max(40,(maxY-minY));
    pipes.push({ x: W+40, gapY: gapY, gapH: gapH, w: 76, passed:false });
  }

  function die(){
    state='over';
    sfx.die();
    if(score>best){
      best=score;
      try{ localStorage.setItem('neonFlappyBest', String(best)); }catch(e){}
      syncBest();
    }
    finalScoreEl.textContent = 'Score: '+score+'   •   Best: '+best;
    show('over');
  }

  function update(dt){
    time += dt;
    if(state==='menu' || state==='options' || state==='ready'){
      bird.y = H*0.42 + Math.sin(time*3)*10;
      bird.rot = Math.sin(time*3+1)*0.08;
      groundX = (groundX + 60*dt) % 48;
      return;
    }
    if(state==='over'){
      bird.vy += GRAV*dt; bird.y += bird.vy*dt;
      bird.rot = Math.min(1.4, bird.rot + dt*4);
      var floor = H-GROUND_H-bird.r;
      if(bird.y > floor){ bird.y=floor; bird.vy=0; }
      return;
    }
    /* playing */
    bird.vy += GRAV*dt;
    bird.y += bird.vy*dt;
    bird.rot = Math.max(-0.45, Math.min(1.35, bird.vy/900));
    groundX = (groundX + speed()*dt) % 48;
    spawnTimer -= dt;
    if(spawnTimer<=0){ spawnPipe(); spawnTimer = 300/speed(); }
    var sp = speed(), i, p;
    for(i=0;i<pipes.length;i++){
      p=pipes[i]; p.x -= sp*dt;
      if(!p.passed && p.x+p.w < bird.x-bird.r){
        p.passed=true; score++; scoreEl.textContent=score; sfx.score();
      }
    }
    if(pipes.length && pipes[0].x < -140) pipes.shift();
    var bTop=bird.y-bird.r, bBot=bird.y+bird.r;
    if(bBot >= H-GROUND_H || bTop <= 0){ die(); return; }
    for(i=0;i<pipes.length;i++){
      p=pipes[i];
      if(bird.x+bird.r > p.x && bird.x-bird.r < p.x+p.w){
        var gapTop=p.gapY-p.gapH/2, gapBot=p.gapY+p.gapH/2;
        if(bTop < gapTop || bBot > gapBot){ die(); return; }
      }
    }
  }

  function drawPipe(x,y,w,h,isTop){
    if(h<=0) return;
    ctx.save();
    ctx.fillStyle='#1E1B16';
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle='rgba(255,255,255,0.10)';
    ctx.fillRect(x+8,y,6,h);
    ctx.fillStyle='#A8822F';
    if(isTop){ ctx.fillRect(x-5,y+h-14,w+10,14); }
    else { ctx.fillRect(x-5,y,w+10,14); }
    ctx.restore();
  }

  function draw(){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#FAF7F0'); g.addColorStop(0.55,'#F7F4EE'); g.addColorStop(1,'#F1ECE1');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    var i, s;
    ctx.save();
    for(i=0;i<dust.length;i++){
      s=dust[i];
      ctx.globalAlpha = 0.25 + 0.35*Math.abs(Math.sin(time*2+s.tw));
      ctx.fillStyle='#C9C1AC';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.3); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha=1;
    for(i=0;i<pipes.length;i++){
      var p=pipes[i];
      var gapTop=p.gapY-p.gapH/2, gapBot=p.gapY+p.gapH/2;
      drawPipe(p.x, 0, p.w, gapTop, true);
      drawPipe(p.x, gapBot, p.w, H-GROUND_H-gapBot, false);
    }
    ctx.fillStyle='#1E1B16';
    ctx.fillRect(0,H-GROUND_H,W,GROUND_H);
    ctx.fillStyle='#A8822F';
    ctx.fillRect(0,H-GROUND_H,W,2);
    ctx.fillStyle='rgba(168,130,47,0.5)';
    for(var dx=-groundX; dx<W; dx+=48){
      ctx.fillRect(dx, H-GROUND_H+28, 24, 3);
    }
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.fillStyle='#1E1B16';
    ctx.beginPath(); ctx.arc(0,0,bird.r,0,6.3); ctx.fill();
    ctx.strokeStyle='#A8822F'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,bird.r-1,0,6.3); ctx.stroke();
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath(); ctx.arc(5,-5,5.5,0,6.3); ctx.fill();
    ctx.fillStyle='#1E1B16';
    ctx.beginPath(); ctx.arc(6.5,-5,2.6,0,6.3); ctx.fill();
    ctx.fillStyle='#A8822F';
    ctx.beginPath();
    ctx.moveTo(bird.r-2,-1); ctx.lineTo(bird.r+9,3.5); ctx.lineTo(bird.r-2,8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  var last=performance.now();
  function loop(now){
    var dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  /* ---------- Input ---------- */
  function press(e){
    if(e){
      if(e.target && e.target.closest && e.target.closest('button')) return;
      if(e.cancelable) e.preventDefault();
    }
    if(state==='ready'){ state='playing'; show(null); sfx.flap(); bird.vy = FLAP_V; }
    else if(state==='playing'){ sfx.flap(); bird.vy = FLAP_V; }
  }
  window.addEventListener('pointerdown', press);
  window.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); press(e); }
  });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

  function onTap(id, fn){
    document.getElementById(id).addEventListener('click', function(e){
      e.stopPropagation(); sfx.click(); fn();
    });
  }
  onTap('btnStart', function(){ goReady(); });
  onTap('btnOptions', function(){ state='options'; show('options'); });
  onTap('btnExit', function(){ window.location.href='index.html'; });
  onTap('btnBack', function(){ state='menu'; show('menu'); });
  onTap('btnRetry', function(){ goReady(); });
  onTap('btnMenu2', function(){ goMenu(); });
  onTap('btnSound', function(){
    soundOn = !soundOn;
    try{ localStorage.setItem('neonFlappySound', soundOn ? 'on' : 'off'); }catch(e){}
    refreshOptionsUI();
  });
  onTap('btnDiff', function(){
    var order = ['easy','normal','hard'];
    difficulty = order[(order.indexOf(difficulty)+1)%order.length];
    try{ localStorage.setItem('neonFlappyDiff', difficulty); }catch(e){}
    refreshOptionsUI();
  });

  show('menu');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
