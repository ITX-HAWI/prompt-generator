<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>Zombie Hunt</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#0c0e10; color:#fff;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  #rot { position:fixed; inset:0; overflow:hidden; }
  #rot.land {
    left:50%; top:50%; right:auto; bottom:auto;
    width:100vh; height:100vw;
    transform:translate(-50%,-50%) rotate(90deg);
  }
  #scene { position:absolute; inset:0; }
  #scene canvas { display:block; }
  .hidden { display:none !important; }

  /* ============ PUBG-style HUD ============ */
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:8px 10px; pointer-events:none;
  }
  #pubgStats {
    background:rgba(12,14,16,.55); border-radius:8px; padding:7px 10px;
    color:#fff; font-size:13px; font-weight:700; letter-spacing:.5px;
    display:flex; flex-direction:column; gap:3px; min-width:120px;
  }
  #pubgStats .statline { display:flex; align-items:center; gap:6px; }
  #pubgStats .sic { font-size:12px; }
  #pubgStats b { font-size:14px; }
  #killedV { color:#E8B93C; }
  #scoreRow {
    font-size:10px; font-weight:700; letter-spacing:1.5px; color:rgba(255,255,255,.75);
    border-top:1px solid rgba(255,255,255,.25); padding-top:4px; white-space:nowrap;
  }
  #scoreRow b { color:#E8B93C; font-size:13px; }
  #bestV { color:rgba(255,255,255,.5); font-size:9px; margin-left:4px; }
  #compassWrap { display:flex; flex-direction:column; align-items:center; }
  #compass { width:min(44vw,300px); height:40px; border-radius:6px; background:rgba(12,14,16,.55); }
  #timeV {
    margin-top:3px; font-size:11px; font-weight:800; letter-spacing:2px; color:#fff;
    background:rgba(12,14,16,.55); border-radius:6px; padding:2px 10px;
  }
  #mmWrap { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #minimap {
    width:92px; height:92px; border-radius:10px;
    border:2px solid rgba(255,255,255,.65); background:rgba(12,14,16,.6);
  }
  #mmBtns { display:flex; gap:8px; pointer-events:auto; }
  .mmbtn {
    width:40px; height:40px; border-radius:50%; font-size:17px; color:#fff;
    background:rgba(12,14,16,.5); border:1.5px solid rgba(255,255,255,.55);
    cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
  }
  .mmbtn:active { transform:scale(.9); }

  #comboTag {
    position:fixed; top:50%; left:0; right:0; z-index:2; text-align:center;
    font-size:17px; font-weight:800; letter-spacing:3px; color:#E8B93C;
    text-shadow:0 1px 4px rgba(0,0,0,.65);
    pointer-events:none; opacity:0; transition:opacity .2s; margin-top:46px;
  }
  #crosshair {
    position:fixed; left:50%; top:50%; z-index:2; pointer-events:none;
    width:30px; height:30px; margin:-15px 0 0 -15px;
    transition:transform .08s; filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
  }
  #crosshair:before, #crosshair:after {
    content:''; position:absolute; background:rgba(255,255,255,.95);
  }
  #crosshair:before { left:14px; top:3px; width:2px; height:24px; }
  #crosshair:after { top:14px; left:3px; height:2px; width:24px; }
  #crosshair .dot {
    position:absolute; left:12.5px; top:12.5px; width:5px; height:5px; border-radius:50%;
    background:#E8B93C;
  }
  #hitmark {
    position:fixed; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px;
    z-index:2; pointer-events:none;
  }
  #hitmark i {
    position:absolute; left:16px; top:2px; width:2.5px; height:30px; background:#fff;
    box-shadow:0 0 4px rgba(0,0,0,.8);
  }
  #hitmark i:first-child { transform:rotate(45deg); }
  #hitmark i:last-child { transform:rotate(-45deg); }
  #dmgflash {
    position:fixed; inset:0; z-index:3; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(180,30,30,.55) 100%);
    transition:opacity .15s;
  }

  .firebtn {
    position:fixed; z-index:4; border-radius:50%; cursor:pointer; font-family:inherit;
    background:rgba(12,14,16,.42); border:2px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
  }
  .firebtn:active { transform:scale(.9); background:rgba(232,185,60,.35); }
  #fireBtn { right:22px; bottom:104px; width:96px; height:96px; }
  #fireBtnL { left:22px; bottom:216px; width:62px; height:62px; }
  #scopeBtn {
    position:fixed; right:134px; bottom:124px; z-index:4; width:60px; height:60px; border-radius:50%;
    background:rgba(12,14,16,.42); border:2px solid rgba(255,255,255,.6); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
  }
  #scopeBtn.zoom { background:rgba(232,185,60,.45); }

  #weaponPanel {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:2;
    display:flex; flex-direction:column; align-items:center; pointer-events:none; gap:5px;
  }
  #wRow {
    display:flex; align-items:center; gap:8px;
    background:rgba(12,14,16,.55); border-radius:8px; padding:6px 8px;
  }
  .wslot {
    display:flex; align-items:center; gap:7px; padding:5px 10px;
    background:transparent; border:1.5px solid rgba(255,255,255,.3); border-radius:8px;
    color:#fff; font-size:10px; font-weight:800; letter-spacing:1px; cursor:pointer; font-family:inherit;
    pointer-events:auto;
  }
  .wslot.active { border-color:#E8B93C; background:rgba(232,185,60,.15); }
  #wAmmo { font-size:15px; font-weight:800; color:#fff; }
  #hpbar {
    width:210px; height:9px; border-radius:5px; background:rgba(12,14,16,.55);
    overflow:hidden; border:1px solid rgba(255,255,255,.35);
  }
  #hpfill { height:100%; width:100%; border-radius:5px; background:#f2f2f2; transition:width .2s; }
  #levelV {
    font-size:10px; font-weight:800; letter-spacing:2px; color:#E8B93C;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }

  #joyBase {
    position:fixed; z-index:3; width:124px; height:124px; margin:-62px 0 0 -62px;
    border:2px solid rgba(255,255,255,.55); border-radius:50%; pointer-events:none;
    display:none; background:rgba(12,14,16,.28);
  }
  #joyNub {
    position:fixed; z-index:3; width:54px; height:54px; margin:-27px 0 0 -27px;
    background:rgba(255,255,255,.8); border-radius:50%; pointer-events:none; display:none;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }

  #feed {
    position:fixed; top:120px; left:0; right:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .feedpill {
    background:rgba(12,14,16,.72); color:#fff; font-size:13px; font-weight:700;
    padding:6px 14px; border-radius:6px; letter-spacing:.5px;
    border-left:3px solid #E8B93C;
    animation:feedin .25s ease-out;
  }
  .feedpill.gold { color:#E8B93C; }
  @keyframes feedin {
    from { transform:translateY(-8px); opacity:0; }
    to { transform:none; opacity:1; }
  }

  /* ============ PUBG lobby-style overlays ============ */
  #overlay {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(8,10,12,.93);
    text-align:center; padding:20px;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:40px; font-weight:800; letter-spacing:8px; padding-left:8px;
    color:#fff; margin-bottom:12px; text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  #overlay .rule { width:56px; height:3px; background:#E8B93C; margin:0 auto 22px; }
  #overlay .sub { font-size:13px; color:rgba(255,255,255,.6); letter-spacing:4px; margin-bottom:14px; }
  #overlay .howto { font-size:13px; color:rgba(255,255,255,.78); letter-spacing:1px; line-height:1.9; margin-bottom:22px; }
  #overlay .err { font-size:14px; color:#ff8a8a; max-width:300px; line-height:1.5; margin-bottom:20px; }
  .btn {
    display:block; width:230px; margin:9px auto; padding:14px 0 14px 4px;
    font-size:16px; font-weight:700; letter-spacing:4px; color:#fff;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.4); border-radius:10px;
    cursor:pointer; transition:transform .1s ease; font-family:inherit;
  }
  .btn:active { transform:scale(.96); }
  .btn.solid { background:#E8B93C; border-color:#E8B93C; color:#141414; }
  .opt-row { display:flex; align-items:center; justify-content:space-between; width:280px; margin:12px auto; }
  .opt-row .label { font-size:15px; letter-spacing:2px; color:rgba(255,255,255,.7); }
  .opt-row .val {
    min-width:150px; padding:10px 0; font-size:14px; font-weight:700; letter-spacing:1px;
    border:1.5px solid #E8B93C; border-radius:10px; color:#fff; cursor:pointer;
    background:rgba(255,255,255,.06); font-family:inherit;
  }
  #stat { margin-top:18px; font-size:14px; letter-spacing:2px; color:rgba(255,255,255,.65); }
  #stat b { color:#E8B93C; }
  #rotHint {
    position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); z-index:9;
    background:rgba(12,14,16,.88); color:#fff; font-size:15px; font-weight:700;
    padding:12px 22px; border-radius:12px; border:1.5px solid #E8B93C;
    pointer-events:none; text-align:center; letter-spacing:.5px;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="rot">
<div id="scene"></div>
<div id="hud">
  <div id="pubgStats">
    <span class="statline"><span class="sic">🏃</span>Alive&nbsp;<b id="aliveV">0</b></span>
    <span class="statline"><span class="sic">💀</span>Killed&nbsp;<b id="killedV">0</b></span>
    <div id="scoreRow">SCORE&nbsp;<b id="scoreV">0</b><span id="bestV"></span></div>
  </div>
  <div id="compassWrap">
    <canvas id="compass" width="300" height="40"></canvas>
    <div id="timeV">1:00</div>
  </div>
  <div id="mmWrap">
    <canvas id="minimap" width="104" height="104"></canvas>
    <div id="mmBtns">
      <button id="pauseBtn" class="hidden mmbtn" title="Menu">⚙</button>
      <button id="rotBtn" class="hidden mmbtn" title="Rotate 9:16 / 16:9">⟳</button>
    </div>
  </div>
</div>
<div id="feed"></div>
<div id="comboTag"></div>
<div id="dmgflash"></div>
<div id="crosshair" class="hidden"><div class="dot"></div></div>
<div id="hitmark" class="hidden"><i></i><i></i></div>
<button id="scopeBtn" class="hidden" title="Aim zoom"><svg viewBox="0 0 40 40" width="26" height="26"><circle cx="20" cy="20" r="11" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M20 2v10M20 28v10M2 20h10M28 20h10" stroke="#fff" stroke-width="2.5"/></svg></button>
<button id="fireBtnL" class="hidden firebtn" title="Fire"><svg viewBox="0 0 24 48" width="16" height="32"><path d="M12 2 C16 8 18 14 18 22 L18 32 L6 32 L6 22 C6 14 8 8 12 2 Z" fill="rgba(255,255,255,.92)"/><rect x="6" y="34" width="12" height="12" rx="2" fill="rgba(255,255,255,.92)"/></svg></button>
<button id="fireBtn" class="hidden firebtn" title="Fire"><svg viewBox="0 0 24 48" width="24" height="48"><path d="M12 2 C16 8 18 14 18 22 L18 32 L6 32 L6 22 C6 14 8 8 12 2 Z" fill="rgba(255,255,255,.92)"/><rect x="6" y="34" width="12" height="12" rx="2" fill="rgba(255,255,255,.92)"/></svg></button>
<div id="weaponPanel" class="hidden">
  <div id="wRow"><button class="wslot active" id="wSlot0"><svg viewBox="0 0 120 36" width="72" height="22"><path d="M4 22 L28 22 L34 14 L44 14 L48 20 L78 20 L84 12 L92 12 L96 20 L116 20 L116 25 L96 25 L92 30 L84 30 L80 25 L52 25 L48 32 L40 32 L36 25 L4 25 Z" fill="rgba(255,255,255,.92)"/></svg><span>RIFLE</span></button><button class="wslot" id="wSlot1"><svg viewBox="0 0 120 36" width="72" height="22"><path d="M2 20 L30 20 L34 14 L40 14 L44 20 L70 20 L66 27 L44 27 L40 33 L34 33 L30 27 L2 27 Z" fill="rgba(255,255,255,.92)"/><rect x="46" y="7" width="26" height="7" rx="3" fill="rgba(255,255,255,.92)"/></svg><span>SNIPER</span></button></div>
  <div id="hpbar"><div id="hpfill"></div></div>
  <div id="levelV">LV 1</div>
</div>
<div id="joyBase"></div>
<div id="joyNub"></div>
<div id="overlay"></div>
</div>
<div id="rotHint" class="hidden">📱 Phone ko landscape ghumao</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ================= settings ================= */
var store = {
  get: function(k, d){ try { var v = localStorage.getItem('shooter3d_'+k); return v === null ? d : v; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem('shooter3d_'+k, v); } catch(e){} }
};
var soundOn = store.get('sound', 'on') === 'on';
var best = parseInt(store.get('best', '0'), 10) || 0;
var HEROS = [
  { id:'joker',   name:'JOKER',   icon:'🃏' },
  { id:'shadow',  name:'SHADOW',  icon:'🥷' },
  { id:'pharaoh', name:'PHARAOH', icon:'👑' },
  { id:'agent',   name:'AGENT',   icon:'🤵' }
];
var heroIdx = parseInt(store.get('hero', '0'), 10) || 0;
if (heroIdx < 0 || heroIdx > 3) heroIdx = 0;
var GUNS = [
  { id:'rifle', name:'RIFLE', auto:true },
  { id:'sniper', name:'SNIPER', auto:false }
];
var gunIdx = parseInt(store.get('gun', '0'), 10) || 0;
if (gunIdx < 0 || gunIdx > 1) gunIdx = 0;
var SENS = [
  { n:'LOW', m:0.6 },
  { n:'MEDIUM', m:1.0 },
  { n:'HIGH', m:1.8 }
];
var sensIdx = parseInt(store.get('sens', '2'), 10);
if (isNaN(sensIdx) || sensIdx < 0 || sensIdx > 2) sensIdx = 2;
function sensM(){ return SENS[sensIdx].m; }

var overlayEl = document.getElementById('overlay');
var sceneEl = document.getElementById('scene');
var scoreV = document.getElementById('scoreV');
var bestV = document.getElementById('bestV');
var timeV = document.getElementById('timeV');
var levelV = document.getElementById('levelV');
var comboTag = document.getElementById('comboTag');
var hpfill = document.getElementById('hpfill');
var dmgflash = document.getElementById('dmgflash');
var pauseBtn = document.getElementById('pauseBtn');
var rotBtn = document.getElementById('rotBtn');
var rotEl = document.getElementById('rot');
var aliveV = document.getElementById('aliveV');
var killedV = document.getElementById('killedV');
var feedEl = document.getElementById('feed');
var hitmark = document.getElementById('hitmark');
var scopeBtn = document.getElementById('scopeBtn');
var fireBtnL = document.getElementById('fireBtnL');
var weaponPanel = document.getElementById('weaponPanel');
var compC = document.getElementById('compass'), compX = null;
var mmC = document.getElementById('minimap'), mmX = null;
var fireBtn = document.getElementById('fireBtn');
var crosshair = document.getElementById('crosshair');
var joyBase = document.getElementById('joyBase');
var joyNub = document.getElementById('joyNub');
var W = window.innerWidth, H = window.innerHeight;
var VW = W, VH = H;   // layout size inside #rot (swapped when CSS-rotated)
var rotated = false;  // true while #rot is turned 90deg for 16:9 on a portrait screen
var orient = store.get('orient', W > H ? 'land' : 'port'); // 'port' = 9:16, 'land' = 16:9
if (orient !== 'land' && orient !== 'port') orient = 'port';
function orientLabel(){ return orient === 'land' ? '16:9 LANDSCAPE' : '9:16 PORTRAIT'; }
function applyOrient(){
  rotated = (orient === 'land' && window.innerHeight > window.innerWidth);
  rotEl.classList.toggle('land', rotated);
  onResize();
  var ob = document.getElementById('oOrient');
  if (ob) ob.textContent = orientLabel();
  var rh = document.getElementById('rotHint');
  if (rh){
    if (rotated){
      rh.classList.remove('hidden');
      setTimeout(function(){ rh.classList.add('hidden'); }, 4000);
    } else rh.classList.add('hidden');
  }
}
function toggleOrient(){
  orient = (orient === 'land') ? 'port' : 'land';
  store.set('orient', orient);
  applyOrient();
}
// map a screen touch/mouse point into #rot game coordinates
function mapPt(cx, cy){
  if (rotated) return { x: cy, y: W - cx };
  return { x: cx, y: cy };
}

/* ================= audio ================= */
var AC = null, master = null;
function audio(){
  if (!soundOn) return null;
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch(e){ return null; }
}
function tone(freq, dur, type, vol, slideTo, delay){
  var ac = audio(); if (!ac) return;
  var t = ac.currentTime + (delay || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
var sfx = {
  click:  function(){ tone(620, 0.06, 'square', 0.18); },
  shoot:  function(){ tone(160, 0.1, 'square', 0.5, 60); tone(1200, 0.05, 'square', 0.2, 500); },
  hit:    function(){ tone(300, 0.08, 'square', 0.35, 180); },
  kill:   function(combo){ var c = Math.min(combo, 10); tone(440 + c*40, 0.14, 'sine', 0.5, 720 + c*40); },
  hurt:   function(){ tone(140, 0.2, 'sawtooth', 0.5, 70); },
  snipe:  function(){ tone(90, 0.28, 'square', 0.6, 40); tone(1800, 0.08, 'square', 0.22, 300); },
  level:  function(){ var n=[523,659,784]; for (var i=0;i<n.length;i++) tone(n[i], 0.14, 'sine', 0.4, null, i*0.09); },
  over:   function(){ tone(300, 0.5, 'sawtooth', 0.32, 80); }
};

/* ================= state ================= */
var state = 'menu'; // menu | options | playing | gameover
var paused = false;
var score = 0, combo = 0, comboT = 0, level = 1, elapsed = 0, spawnT = 0;
var kills = 0, zoomed = false;
var hp = 100, lastDmgT = -99;
var yaw = 0, pitch = -0.05;
var colliders = [];   // houses inside the arena: {x, z, r}
var player = { x:0, z:8 };
var joy = { id:null, ox:0, oy:0, dx:0, dy:0 };
var look = { id:null, lx:0, ly:0 };
var recoil = 0, flashT = 0, lastShot = 0, walkPhase = 0;
var overReason = '';

/* ================= three.js ================= */
var scene = null, camera = null, renderer = null, raycaster = null;
var hero = null;          // {group, legL,legR,armL,armR, gunTip, flashMesh, flashLight}
var enemies = [];         // {group, legL,legR,armL,armR, eyeL,eyeR, x,z, hp, speed, walkPhase, atkCd, lunge, dying, dieT, hitFlash}
var particles = [];
var threeOK = (typeof THREE !== 'undefined');
var particleGeo = null, CENTER2 = null;

function mat(color, rough, metal, emissive, eInt){
  var m = new THREE.MeshStandardMaterial({ color:color, roughness:rough===undefined?0.6:rough, metalness:metal||0 });
  if (emissive){ m.emissive = new THREE.Color(emissive); m.emissiveIntensity = eInt||1; }
  return m;
}
function box(w,h,d,m,x,y,z){
  var o = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  o.position.set(x,y,z); o.castShadow = true;
  return o;
}
/* smooth body helpers — no boxes for characters */
function sph(r, m, x, y, z, ws, hs){
  var o = new THREE.Mesh(new THREE.SphereGeometry(r, ws || 14, hs || 12), m);
  o.position.set(x || 0, y || 0, z || 0); o.castShadow = true;
  return o;
}
function cyl(rt, rb, h, m, x, y, z, seg){
  var o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 14), m);
  o.position.set(x || 0, y || 0, z || 0); o.castShadow = true;
  return o;
}
function capsuleLimb(r, len, m){          // vertical limb, pivot at the top joint
  var g = new THREE.Group();
  g.add(cyl(r, r * 0.82, len, m, 0, -len / 2, 0));
  g.add(sph(r, m, 0, 0, 0));
  g.add(sph(r * 0.82, m, 0, -len, 0));
  return g;
}
function wrapRing(r, tube, m){            // horizontal ring; set position after
  var o = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 22), m);
  o.rotation.x = Math.PI / 2; o.castShadow = true;
  return o;
}
function blobShadow(r){
  var o = new THREE.Mesh(new THREE.CircleGeometry(r, 20),
    new THREE.MeshBasicMaterial({ color:0x1E1B16, transparent:true, opacity:0.22, depthWrite:false }));
  o.rotation.x = -Math.PI / 2; o.position.y = 0.02;
  return o;
}

/* ================= hero models ================= */
function makeRifle(accentMat){
  var g = new THREE.Group();
  var ink = mat(0x2A251D, 0.4, 0.4);
  g.add(box(0.09, 0.12, 0.4, ink, 0, 0, 0));
  var barrel = cyl(0.026, 0.026, 0.3, ink, 0, 0.025, -0.32, 12);

  var cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 256;
  var c = cnv.getContext('2d');
  c.fillStyle = '#6FA055'; c.fillRect(0, 0, 256, 256);
  var i, s;
  for (i = 0; i < 900; i++){
    c.fillStyle = 'rgb(' + Math.floor(85 + Math.random()*45) + ',' +
      Math.floor(120 + Math.random()*60) + ',' + Math.floor(60 + Math.random()*30) + ')';
    s = 2 + Math.random()*5;
    c.fillRect(Math.random()*256, Math.random()*256, s, s*0.7);
  }
  for (i = 0; i < 12; i++){
    c.fillStyle = 'rgba(150,125,85,.45)';
    c.beginPath();
    c.arc(Math.random()*256, Math.random()*256, 8 + Math.random()*18, 0, 6.3);
    c.fill();
  }
  var tx = new THREE.CanvasTexture(cnv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.repeat.set(12, 12);
  return tx;
}

function burst(pos, colorHex, n){
  var col = new THREE.Color(colorHex);
  for (var i=0;i<n;i++){
    var m = new THREE.Mesh(particleGeo,
      new THREE.MeshBasicMaterial({ color:col.clone(), transparent:true }));
    m.position.copy(pos);
    var a = Math.random()*Math.PI*2;
    particles.push({ mesh:m,
      vx: Math.cos(a)*(1.5+Math.random()*2.5),
      vy: 1.5+Math.random()*2.5,
      vz: Math.sin(a)*(1.5+Math.random()*2.5),
      life: 0.7, maxLife: 0.7 });
    scene.add(m);
  }
}

/* ================= PUBG compass + minimap ================= */
function drawCompass(){
  if (!compX) return;
  var w = compC.width, h = compC.height;
  compX.clearRect(0, 0, w, h);
  var heading = ((-yaw * 180 / Math.PI) % 360 + 360) % 360;
  var pxPerDeg = w / 120, mid = w / 2;
  compX.textAlign = 'center';
  var labels = { 0:'N', 45:'NE', 90:'E', 135:'SE', 180:'S', 225:'SW', 270:'W', 315:'NW' };
  var d, deg, x, norm;
  for (d = -75; d <= 75; d += 5){
    deg = Math.round((heading + d) / 5) * 5;
    x = mid + (deg - heading) * pxPerDeg;
    if (x < -10 || x > w + 10) continue;
    norm = ((deg % 360) + 360) % 360;
    if (norm % 45 === 0){
      compX.fillStyle = (norm === 0) ? '#E8B93C' : 'rgba(255,255,255,.92)';
      compX.font = '700 14px system-ui, sans-serif';
      compX.fillText(labels[norm], x, 17);
    } else {
      compX.fillStyle = 'rgba(255,255,255,.45)';
      compX.fillRect(x, 24, 1.5, 7);
      if (norm % 15 === 0){
        compX.fillStyle = 'rgba(255,255,255,.6)';
        compX.font = '9px system-ui, sans-serif';
        compX.fillText(String(norm), x, 38);
      }
    }
  }
  compX.fillStyle = '#E8B93C';
  compX.beginPath();
  compX.moveTo(mid - 6, 1); compX.lineTo(mid + 6, 1); compX.lineTo(mid, 9);
  compX.closePath(); compX.fill();
}
function drawMinimap(){
  if (!mmX) return;
  var s = mmC.width;
  mmX.clearRect(0, 0, s, s);
  function mx(x){ return (x + 20) / 40 * s; }
  function mz(z){ return (z + 8) / 38 * s; }
  mmX.strokeStyle = 'rgba(232,185,60,.5)';
  mmX.lineWidth = 1.5;
  mmX.strokeRect(3, 3, s - 6, s - 6);
  var hi, hc;
  mmX.fillStyle = 'rgba(170,135,90,.9)';
  for (hi = 0; hi < colliders.length; hi++){
    hc = colliders[hi];
    var hr = hc.r / 20 * s;
    mmX.fillRect(mx(hc.x) - hr/2, mz(hc.z) - hr/2, hr, hr);
  }
  var i, e;
  for (i = 0; i < enemies.length; i++){
    e = enemies[i];
    if (e.dying) continue;
    mmX.fillStyle = '#ff5252';
    mmX.beginPath(); mmX.arc(mx(e.x), mz(e.z), 3, 0, 6.3); mmX.fill();
  }
  var px = mx(player.x), py = mz(player.z);
  mmX.save();
  mmX.translate(px, py);
  mmX.rotate(Math.atan2(-Math.sin(yaw), Math.cos(yaw)));
  mmX.fillStyle = '#E8B93C';
  mmX.beginPath(); mmX.moveTo(0, -6); mmX.lineTo(4.5, 5); mmX.lineTo(-4.5, 5);
  mmX.closePath(); mmX.fill();
  mmX.restore();
}

/* ================= combat ================= */
function fire(){
  if (state !== 'playing' || paused || !threeOK) return;
  var now = performance.now();
  var g = GUNS[gunIdx];
  if (now - lastShot < (g.auto ? 150 : 600)) return;
  lastShot = now;
  audio();
  if (g.id === 'sniper') sfx.snipe(); else sfx.shoot();
  recoil = 1; flashT = 0.06;
  var P = hero.parts;
  P.flashMesh.visible = true;
  P.flashLight.intensity = 2.4;
  crosshair.style.transform = 'scale(1.35)';
  setTimeout(function(){ crosshair.style.transform = 'scale(1)'; }, 90);
  raycaster.setFromCamera(CENTER2, camera);
  var hits = raycaster.intersectObjects(enemyMeshes());
  if (hits.length > 0){
    var h = hits[0], e = h.object.userData.enemy;
    if (!e || e.dying) return;
    var zone = h.object.userData.zone || 'body';
    var dmg = (g.id === 'sniper')
      ? (zone === 'head' ? 3 : zone === 'body' ? 2 : 1)
      : (zone === 'head' ? 2 : 1);
    burst(h.point, 0xD9A41B, 10);
    e.hp -= dmg;
    var kdx = e.x - player.x, kdz = e.z - player.z, kd = Math.hypot(kdx, kdz) || 1;
    e.x += kdx/kd*0.6; e.z += kdz/kd*0.6;
    e.hitFlash = 0.12;
    for (var fi=0;fi<e.flashMats.length;fi++){ e.flashMats[fi].emissive.setHex(0xFF2222); e.flashMats[fi].emissiveIntensity = 0.8; }
    hitmark.classList.remove('hidden');
    setTimeout(function(){ hitmark.classList.add('hidden'); }, 120);
    combo++; comboT = 0;
    var pts = 10;
    if (e.hp <= 0){
      e.dying = true; e.dieT = 0;
      kills++;
      burst(h.point, 0xB4452F, 14);
      pts = 25 + (combo >= 2 ? (combo-1)*5 : 0);
      popup(zone === 'head' ? '🎯 HEADSHOT +' + pts : '🧟 +' + pts, combo >= 3);
      sfx.kill(combo);
    } else {
      sfx.hit();
    }
    score += pts;
  } else {
    combo = 0;
  }
  updateHUD();
}
function hurtPlayer(dmg){
  if (state !== 'playing') return;
  hp -= dmg;
  lastDmgT = elapsed;
  combo = 0;
  dmgflash.style.opacity = 1;
  setTimeout(function(){ dmgflash.style.opacity = 0; }, 220);
  sfx.hurt();
  updateHUD();
  if (hp <= 0){ hp = 0; gameOver('YOU DIED'); }
}

function collide(px, pz, rad){
  for (var ci = 0; ci < colliders.length; ci++){
    var cc = colliders[ci];
    var ox = px - cc.x, oz = pz - cc.z;
    var od = Math.hypot(ox, oz), rr = cc.r + rad;
    if (od < rr){
      if (od < 0.001){ ox = 1; oz = 0; od = 1; }
      px = cc.x + ox/od*rr;
      pz = cc.z + oz/od*rr;
    }
  }
  return { x: px, z: pz };
}
/* ================= update ================= */
function update(dt){
  elapsed += dt;
  comboT += dt;
  if (comboT > 3) combo = 0;
  var nl = 1 + Math.floor(elapsed/15);
  if (nl !== level){ level = nl; sfx.level(); }
  if (elapsed - lastDmgT > 4 && hp < 100) hp = Math.min(100, hp + 5*dt);

  // movement
  var mx = joy.dx/48, my = joy.dy/48;
  var len = Math.hypot(mx, my);
  if (len > 1){ mx/=len; my/=len; }
  var moving = len > 0.12;
  if (moving){
    var sp = 4.4;
    var sin = Math.sin(yaw), cos = Math.cos(yaw);
    player.x += (cos*mx + sin*my)*sp*dt;
    player.z += (-sin*mx + cos*my)*sp*dt;
    player.x = Math.max(-20, Math.min(20, player.x));
    player.z = Math.max(-8, Math.min(30, player.z));
    var cp = collide(player.x, player.z, 0.45);
    player.x = cp.x; player.z = cp.z;
    walkPhase += dt*11;
  }
  // hero pose
  var HP = hero.parts;
  hero.group.position.set(player.x, 0, player.z);
  hero.group.rotation.y = yaw;
  var sw = moving ? Math.sin(walkPhase)*0.55 : 0;
  HP.legL.rotation.x = sw; HP.legR.rotation.x = -sw;
  HP.armL.rotation.x = -sw*0.7; HP.armR.rotation.x = -0.5 + sw*0.15;
  // third-person camera
  var fx = -Math.sin(yaw)*Math.cos(pitch),
      fy = Math.sin(pitch),
      fz = -Math.cos(yaw)*Math.cos(pitch);
  var cx = player.x - fx*3.8, cy = 2.1 - fy*3.8, cz = player.z - fz*3.8;
  if (cy < 0.7) cy = 0.7;
  camera.position.set(cx, cy, cz);
  camera.lookAt(player.x + fx*8, 1.5 + fy*8, player.z + fz*8);

  // enemies
  spawnT -= dt;
  var want = Math.min(4 + level, 9);
  if (spawnT <= 0 && enemies.length < want){ spawnEnemy(); spawnT = 1.5; }
  var i, e, dx, dz, dist;
  for (i=enemies.length-1;i>=0;i--){
    e = enemies[i];
    if (e.dying){
      e.dieT += dt;
      e.group.rotation.x = -Math.min(1.4, e.dieT*4);
      e.group.position.y = -Math.max(0, e.dieT-0.5)*1.2;
      if (e.dieT > 0.9) removeEnemy(e);
      continue;
    }
    if (e.hitFlash > 0){
      e.hitFlash -= dt;
      if (e.hitFlash <= 0) for (var fi2=0;fi2<e.flashMats.length;fi2++){ e.flashMats[fi2].emissive.setHex(0x000000); e.flashMats[fi2].emissiveIntensity = 0; }
    }
    dx = player.x - e.x; dz = player.z - e.z;
    dist = Math.hypot(dx, dz);
    // separation
    for (var j=0;j<enemies.length;j++){
      if (j === i) continue;
      var o = enemies[j];
      var sx = e.x - o.x, sz = e.z - o.z, sd = Math.hypot(sx, sz);
      if (sd > 0.01 && sd < 0.9){ e.x += sx/sd*dt*1.5; e.z += sz/sd*dt*1.5; }
    }
    if (dist > 1.35){
      e.x += dx/dist*e.speed*dt;
      e.z += dz/dist*e.speed*dt;
      e.walkPhase += dt*7;
      var w = Math.sin(e.walkPhase)*0.5;
      e.legL.rotation.x = w; e.legR.rotation.x = -w;
    } else {
      e.atkCd -= dt;
      e.legL.rotation.x *= 0.9; e.legR.rotation.x *= 0.9;
      if (e.atkCd <= 0){
        e.atkCd = 1.45;
        e.armL.rotation.x = -1.6; e.armR.rotation.x = -1.6;
        hurtPlayer(8);
      }
    }
    e.group.rotation.y = Math.atan2(-dx, -dz);
    var ce = collide(e.x, e.z, 0.4);
    e.x = ce.x; e.z = ce.z;
    e.group.position.set(e.x, 0, e.z);
    // attack arms recover
    if (e.atkCd < 0.8){ e.armL.rotation.x += (-0.95 - e.armL.rotation.x)*dt*6; e.armR.rotation.x += (-0.95 - e.armR.rotation.x)*dt*6; }
  }
  // particles
  for (i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){
      scene.remove(p.mesh); p.mesh.material.dispose();
      particles.splice(i, 1); continue;
    }
    p.vy -= 7*dt;
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt;
    p.mesh.position.z += p.vz*dt;
    p.mesh.material.opacity = p.life/p.maxLife;
    var k = p.life/p.maxLife;
    p.mesh.scale.set(k, k, k);
  }
  // gun recoil + flash
  if (recoil > 0){
    recoil = Math.max(0, recoil - dt*7);
    HP.gunModel.position.z = -0.30 + recoil*0.08;
    HP.gunModel.rotation.x = recoil*0.1;
  }
  if (flashT > 0){
    flashT -= dt;
    if (flashT <= 0){ HP.flashMesh.visible = false; HP.flashLight.intensity = 0; }
  }
  updateHUD();
}

/* ================= loop ================= */
var lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  var dt = Math.min((t-lastT)/1000, 0.05);
  lastT = t;
  if (state === 'playing' && !paused && threeOK) update(dt);
  if (threeOK){ drawCompass(); drawMinimap(); }
  if (renderer) renderer.render(scene, camera);
}

}
function switchGun(i){
  if (i === gunIdx || i < 0 || i > 1) return;
  gunIdx = i;
  store.set('gun', String(i));
  stopFire();
  if (hero) hero.parts.setGun(GUNS[gunIdx].id);
  renderSlots();
  sfx.click();
}
function startFire(e){
  if (e) e.preventDefault();
  fire();
  stopFire();
  if (GUNS[gunIdx].auto) autoTimer = setInterval(fire, 150);
}
function stopFire(){ if (autoTimer){ clearInterval(autoTimer); autoTimer = null; } }
fireBtn.addEventListener('pointerdown', startFire);
fireBtnL.addEventListener('pointerdown', startFire);
[fireBtn, fireBtnL].forEach(function(b){
  b.addEventListener('pointerup', stopFire);
  b.addEventListener('pointercancel', stopFire);
  b.addEventListener('pointerleave', stopFire);
});
document.getElementById('wSlot0').addEventListener('click', function(){ switchGun(0); });
document.getElementById('wSlot1').addEventListener('click', function(){ switchGun(1); });
function setZoom(z){
  zoomed = z;
  if (camera){ camera.fov = z ? 42 : 62; camera.updateProjectionMatrix(); }
  scopeBtn.classList.toggle('zoom', z);
}
scopeBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); setZoom(true); });
scopeBtn.addEventListener('pointerup', function(){ setZoom(false); });
scopeBtn.addEventListener('pointercancel', function(){ setZoom(false); });
scopeBtn.addEventListener('pointerleave', function(){ setZoom(false); });
document.addEventListener('touchstart', function(e){
  if (state !== 'playing' || paused) return;
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.target === fireBtn || t.target === fireBtnL || t.target === scopeBtn || t.target === pauseBtn || t.target === rotBtn) continue;
    var p = mapPt(t.clientX, t.clientY);
    if (p.x < VW*0.45 && joy.id === null){
      joy.id = t.identifier; joy.ox = p.x; joy.oy = p.y;
      joy.dx = 0; joy.dy = 0;
      joyBase.style.display = 'block'; joyNub.style.display = 'block';
      joyBase.style.left = p.x+'px'; joyBase.style.top = p.y+'px';
      joyNub.style.left = p.x+'px'; joyNub.style.top = p.y+'px';
    } else if (look.id === null){
      look.id = t.identifier; look.lx = p.x; look.ly = p.y;
    }
  }
}, { passive:false });
document.addEventListener('touchmove', function(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    var mp = mapPt(t.clientX, t.clientY);
    if (t.identifier === joy.id){
      joy.dx = mp.x - joy.ox; joy.dy = mp.y - joy.oy;
      var l = Math.hypot(joy.dx, joy.dy);
      if (l > 48){ joy.dx = joy.dx/l*48; joy.dy = joy.dy/l*48; }
      joyNub.style.left = (joy.ox + joy.dx)+'px';
      joyNub.style.top = (joy.oy + joy.dy)+'px';
    } else if (t.identifier === look.id){
      yaw -= (mp.x - look.lx)*0.0052*sensM();
      pitch -= (mp.y - look.ly)*0.0042*sensM();
      pitch = Math.max(-0.55, Math.min(0.5, pitch));
      look.lx = mp.x; look.ly = mp.y;
    }
  }
  if (state === 'playing' && !paused) e.preventDefault();
}, { passive:false });
function endTouch(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.identifier === joy.id){
      joy.id = null; joy.dx = 0; joy.dy = 0;
      joyBase.style.display = 'none'; joyNub.style.display = 'none';
    }
    if (t.identifier === look.id) look.id = null;
  }
}
document.addEventListener('touchend', endTouch);
document.addEventListener('touchcancel', endTouch);
var keys = {};
document.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); fire(); }
  if (e.code === 'Escape' && state === 'playing') doPause();
  if (e.code === 'Digit1') switchGun(0);
  if (e.code === 'Digit2') switchGun(1);
  keys[e.code] = true;
});
document.addEventListener('keyup', function(e){ keys[e.code] = false; });
var mouseDown = false, mLX = 0, mLY = 0;
document.addEventListener('mousedown', function(e){
  if (state !== 'playing' || paused) return;
  var pm = mapPt(e.clientX, e.clientY);
  mouseDown = true; mLX = pm.x; mLY = pm.y;
});
document.addEventListener('mousemove', function(e){
  if (!mouseDown || state !== 'playing' || paused) return;
  var qm = mapPt(e.clientX, e.clientY);
  yaw -= (qm.x - mLX)*0.004*sensM();
  pitch -= (qm.y - mLY)*0.0032*sensM();
  pitch = Math.max(-0.55, Math.min(0.5, pitch));
  mLX = qm.x; mLY = qm.y;
});
document.addEventListener('mouseup', function(){ mouseDown = false; });
// WASD movement
setInterval(function(){
  if (state !== 'playing' || paused) return;
  var mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) my += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if (mx || my){ joy.dx = mx*48; joy.dy = my*48; joy.id = 'kbd'; }
  else if (joy.id === 'kbd'){ joy.id = null; joy.dx = 0; joy.dy = 0; }
}, 50);

/* ================= boot ================= */
if (threeOK) initThree();
if (threeOK) hero = buildHero(HEROS[heroIdx].id);
applyOrient();
showMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
