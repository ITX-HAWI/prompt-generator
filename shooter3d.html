<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>Zombie Hunt</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#F7F4EE; color:#1E1B16;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  #rot { position:fixed; inset:0; overflow:hidden; }
  #rot.land {
    left:50%; top:50%; right:auto; bottom:auto;
    width:100vh; height:100vw;
    transform:translate(-50%,-50%) rotate(90deg);
  }
  #scene { position:absolute; inset:0; }
  #scene canvas { display:block; }
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none;
  }
  #hud .col { display:flex; flex-direction:column; align-items:center; min-width:70px; }
  #hud .label { font-size:10px; font-weight:700; letter-spacing:3px; color:rgba(30,27,22,.5); }
  #hud .big { font-size:30px; font-weight:800; color:#1E1B16; line-height:1.1; }
  #hud .sub2 { font-size:12px; font-weight:700; letter-spacing:1px; color:#A8822F; }
  #hpbar { width:120px; height:8px; border-radius:4px; background:rgba(30,27,22,.15); margin-top:6px; overflow:hidden; }
  #hpfill { height:100%; width:100%; border-radius:4px; background:#3E9B4F; transition:width .2s; }
  #comboTag {
    position:fixed; top:104px; left:0; right:0; z-index:2; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:3px; color:#A8822F;
    pointer-events:none; opacity:0; transition:opacity .2s;
  }
  #crosshair {
    position:fixed; left:50%; top:50%; z-index:2; pointer-events:none;
    width:34px; height:34px; margin:-17px 0 0 -17px;
    transition:transform .08s;
  }
  #crosshair:before, #crosshair:after {
    content:''; position:absolute; background:rgba(30,27,22,.85);
  }
  #crosshair:before { left:16px; top:4px; width:2px; height:26px; }
  #crosshair:after { top:16px; left:4px; height:2px; width:26px; }
  #crosshair .dot {
    position:absolute; left:14px; top:14px; width:6px; height:6px; border-radius:50%;
    background:#A8822F;
  }
  #dmgflash {
    position:fixed; inset:0; z-index:3; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(180,30,30,.55) 100%);
    transition:opacity .15s;
  }
  #pauseBtn {
    position:fixed; top:14px; left:14px; z-index:4;
    width:44px; height:44px; border-radius:50%;
    font-size:14px; color:#1E1B16; cursor:pointer; font-family:inherit;
    background:rgba(247,244,238,.85); border:1.5px solid #1E1B16;
  }
  #pauseBtn:active { transform:scale(.92); }
  #rotBtn {
    position:fixed; top:14px; right:14px; z-index:4;
    width:44px; height:44px; border-radius:50%;
    font-size:19px; color:#1E1B16; cursor:pointer; font-family:inherit;
    background:rgba(247,244,238,.85); border:1.5px solid #1E1B16;
  }
  #rotBtn:active { transform:scale(.92); }
  #pauseBtn.hidden, .hidden { display:none !important; }
  #fireBtn {
    position:fixed; right:26px; bottom:34px; z-index:4;
    width:92px; height:92px; border-radius:50%;
    font-size:15px; font-weight:800; letter-spacing:2px; color:#F7F4EE;
    background:#1E1B16; border:3px solid #A8822F; cursor:pointer; font-family:inherit;
    box-shadow:0 4px 18px rgba(30,27,22,.35);
  }
  #fireBtn:active { transform:scale(.9); }
  #joyBase {
    position:fixed; z-index:3; width:110px; height:110px; margin:-55px 0 0 -55px;
    border:2px solid rgba(30,27,22,.35); border-radius:50%; pointer-events:none;
    display:none; background:rgba(247,244,238,.25);
  }
  #joyNub {
    position:fixed; z-index:3; width:48px; height:48px; margin:-24px 0 0 -24px;
    background:rgba(30,27,22,.75); border-radius:50%; pointer-events:none; display:none;
  }
  .scorepop {
    position:fixed; z-index:3; pointer-events:none;
    font-size:22px; font-weight:800; color:#1E1B16;
    animation:rise .8s ease-out forwards;
  }
  .scorepop.gold { color:#A8822F; font-size:30px; }
  @keyframes rise {
    from { transform:translateY(0); opacity:1; }
    to { transform:translateY(-52px); opacity:0; }
  }
  #overlay {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(247,244,238,.96);
    text-align:center; padding:20px;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:38px; font-weight:800; letter-spacing:8px; padding-left:8px;
    color:#1E1B16; margin-bottom:12px;
  }
  #overlay .rule { width:56px; height:2px; background:#A8822F; margin:0 auto 22px; }
  #overlay .sub { font-size:13px; color:rgba(30,27,22,.55); letter-spacing:4px; margin-bottom:14px; }
  #overlay .howto { font-size:13px; color:rgba(30,27,22,.7); letter-spacing:1px; line-height:1.9; margin-bottom:22px; }
  #overlay .err { font-size:14px; color:#a33; max-width:300px; line-height:1.5; margin-bottom:20px; }
  .btn {
    display:block; width:230px; margin:9px auto; padding:14px 0 14px 4px;
    font-size:16px; font-weight:700; letter-spacing:4px; color:#1E1B16;
    background:transparent; border:1.5px solid #1E1B16; border-radius:12px;
    cursor:pointer; transition:transform .1s ease; font-family:inherit;
  }
  .btn:active { transform:scale(.96); }
  .btn.solid { background:#1E1B16; color:#F7F4EE; }
  .opt-row { display:flex; align-items:center; justify-content:space-between; width:280px; margin:12px auto; }
  .opt-row .label { font-size:15px; letter-spacing:2px; color:rgba(30,27,22,.65); }
  .opt-row .val {
    min-width:150px; padding:10px 0; font-size:14px; font-weight:700; letter-spacing:1px;
    border:1.5px solid #A8822F; border-radius:10px; color:#1E1B16; cursor:pointer;
    background:transparent; font-family:inherit;
  }
  #stat { margin-top:18px; font-size:14px; letter-spacing:2px; color:rgba(30,27,22,.6); }
  #stat b { color:#A8822F; }
</style>
</head>
<body>
<div id="rot">
<div id="scene"></div>
<div id="hud">
  <div class="col" style="min-width:44px"></div>
  <div class="col">
    <div class="label">SCORE</div>
    <div class="big" id="scoreV">0</div>
    <div class="sub2" id="bestV">BEST 0</div>
    <div id="hpbar"><div id="hpfill"></div></div>
  </div>
  <div class="col">
    <div class="label">TIME</div>
    <div class="big" id="timeV">1:00</div>
    <div class="sub2" id="levelV">LV 1</div>
  </div>
</div>
<div id="comboTag"></div>
<div id="dmgflash"></div>
<div id="crosshair" class="hidden"><div class="dot"></div></div>
<button id="pauseBtn" class="hidden">&#10074;&#10074;</button>
<button id="rotBtn" class="hidden" title="Rotate 9:16 / 16:9">&#10227;</button>
<button id="fireBtn" class="hidden">FIRE</button>
<div id="joyBase"></div>
<div id="joyNub"></div>
<div id="overlay"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ================= settings ================= */
var store = {
  get: function(k, d){ try { var v = localStorage.getItem('shooter3d_'+k); return v === null ? d : v; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem('shooter3d_'+k, v); } catch(e){} }
};
var soundOn = store.get('sound', 'on') === 'on';
var best = parseInt(store.get('best', '0'), 10) || 0;
var HEROS = [
  { id:'joker',   name:'JOKER',   icon:'🃏' },
  { id:'shadow',  name:'SHADOW',  icon:'🥷' },
  { id:'pharaoh', name:'PHARAOH', icon:'👑' },
  { id:'agent',   name:'AGENT',   icon:'🤵' }
];
var heroIdx = parseInt(store.get('hero', '0'), 10) || 0;
if (heroIdx < 0 || heroIdx > 3) heroIdx = 0;

var overlayEl = document.getElementById('overlay');
var sceneEl = document.getElementById('scene');
var scoreV = document.getElementById('scoreV');
var bestV = document.getElementById('bestV');
var timeV = document.getElementById('timeV');
var levelV = document.getElementById('levelV');
var comboTag = document.getElementById('comboTag');
var hpfill = document.getElementById('hpfill');
var dmgflash = document.getElementById('dmgflash');
var pauseBtn = document.getElementById('pauseBtn');
var rotBtn = document.getElementById('rotBtn');
var rotEl = document.getElementById('rot');
var fireBtn = document.getElementById('fireBtn');
var crosshair = document.getElementById('crosshair');
var joyBase = document.getElementById('joyBase');
var joyNub = document.getElementById('joyNub');
var W = window.innerWidth, H = window.innerHeight;
var VW = W, VH = H;   // layout size inside #rot (swapped when CSS-rotated)
var rotated = false;  // true while #rot is turned 90deg for 16:9 on a portrait screen
var orient = store.get('orient', W > H ? 'land' : 'port'); // 'port' = 9:16, 'land' = 16:9
if (orient !== 'land' && orient !== 'port') orient = 'port';
function orientLabel(){ return orient === 'land' ? '16:9 LANDSCAPE' : '9:16 PORTRAIT'; }
function applyOrient(){
  rotated = (orient === 'land' && window.innerHeight > window.innerWidth);
  rotEl.classList.toggle('land', rotated);
  onResize();
  var ob = document.getElementById('oOrient');
  if (ob) ob.textContent = orientLabel();
}
function toggleOrient(){
  orient = (orient === 'land') ? 'port' : 'land';
  store.set('orient', orient);
  applyOrient();
}
// map a screen touch/mouse point into #rot game coordinates
function mapPt(cx, cy){
  if (rotated) return { x: cy, y: W - cx };
  return { x: cx, y: cy };
}

/* ================= audio ================= */
var AC = null, master = null;
function audio(){
  if (!soundOn) return null;
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch(e){ return null; }
}
function tone(freq, dur, type, vol, slideTo, delay){
  var ac = audio(); if (!ac) return;
  var t = ac.currentTime + (delay || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
var sfx = {
  click:  function(){ tone(620, 0.06, 'square', 0.18); },
  shoot:  function(){ tone(160, 0.1, 'square', 0.5, 60); tone(1200, 0.05, 'square', 0.2, 500); },
  hit:    function(){ tone(300, 0.08, 'square', 0.35, 180); },
  kill:   function(combo){ var c = Math.min(combo, 10); tone(440 + c*40, 0.14, 'sine', 0.5, 720 + c*40); },
  hurt:   function(){ tone(140, 0.2, 'sawtooth', 0.5, 70); },
  level:  function(){ var n=[523,659,784]; for (var i=0;i<n.length;i++) tone(n[i], 0.14, 'sine', 0.4, null, i*0.09); },
  over:   function(){ tone(300, 0.5, 'sawtooth', 0.32, 80); }
};

/* ================= state ================= */
var state = 'menu'; // menu | options | playing | gameover
var paused = false;
var score = 0, combo = 0, comboT = 0, level = 1, elapsed = 0, spawnT = 0;
var hp = 100, lastDmgT = -99;
var GAME_LEN = 60;
var yaw = 0, pitch = -0.05;
var player = { x:0, z:8 };
var joy = { id:null, ox:0, oy:0, dx:0, dy:0 };
var look = { id:null, lx:0, ly:0 };
var recoil = 0, flashT = 0, lastShot = 0, walkPhase = 0;
var overReason = '';

/* ================= three.js ================= */
var scene = null, camera = null, renderer = null, raycaster = null;
var hero = null;          // {group, legL,legR,armL,armR, gunTip, flashMesh, flashLight}
var enemies = [];         // {group, legL,legR,armL,armR, eyeL,eyeR, x,z, hp, speed, walkPhase, atkCd, lunge, dying, dieT, hitFlash}
var particles = [];
var threeOK = (typeof THREE !== 'undefined');
var particleGeo = null, CENTER2 = null;

function mat(color, rough, metal, emissive, eInt){
  var m = new THREE.MeshStandardMaterial({ color:color, roughness:rough===undefined?0.6:rough, metalness:metal||0 });
  if (emissive){ m.emissive = new THREE.Color(emissive); m.emissiveIntensity = eInt||1; }
  return m;
}
function box(w,h,d,m,x,y,z){
  var o = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  o.position.set(x,y,z); o.castShadow = true;
  return o;
}
/* smooth body helpers — no boxes for characters */
function sph(r, m, x, y, z, ws, hs){
  var o = new THREE.Mesh(new THREE.SphereGeometry(r, ws || 14, hs || 12), m);
  o.position.set(x || 0, y || 0, z || 0); o.castShadow = true;
  return o;
}
function cyl(rt, rb, h, m, x, y, z, seg){
  var o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 14), m);
  o.position.set(x || 0, y || 0, z || 0); o.castShadow = true;
  return o;
}
function capsuleLimb(r, len, m){          // vertical limb, pivot at the top joint
  var g = new THREE.Group();
  g.add(cyl(r, r * 0.82, len, m, 0, -len / 2, 0));
  g.add(sph(r, m, 0, 0, 0));
  g.add(sph(r * 0.82, m, 0, -len, 0));
  return g;
}
function wrapRing(r, tube, m){            // horizontal ring; set position after
  var o = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 22), m);
  o.rotation.x = Math.PI / 2; o.castShadow = true;
  return o;
}
function blobShadow(r){
  var o = new THREE.Mesh(new THREE.CircleGeometry(r, 20),
    new THREE.MeshBasicMaterial({ color:0x1E1B16, transparent:true, opacity:0.22, depthWrite:false }));
  o.rotation.x = -Math.PI / 2; o.position.y = 0.02;
  return o;
}

/* ================= hero models ================= */
function makeGun(accentMat){
  var g = new THREE.Group();
  var ink = mat(0x2A251D, 0.4, 0.4);
  g.add(box(0.09, 0.12, 0.4, ink, 0, 0, 0));
  var barrel = cyl(0.026, 0.026, 0.3, ink, 0, 0.025, -0.32, 12);
  barrel.rotation.x = Math.PI/2; g.add(barrel);
  var grip = box(0.075, 0.2, 0.09, ink, 0, -0.14, 0.09); grip.rotation.x = 0.25; g.add(grip);
  var mgzn = box(0.07, 0.14, 0.08, ink, 0, -0.1, -0.05); mgzn.rotation.x = -0.2; g.add(mgzn);
  g.add(sph(0.02, accentMat, 0, 0.085, -0.1, 8, 8));
  var ringM = new THREE.Mesh(new THREE.TorusGeometry(0.032, 0.008, 8, 20), accentMat);
  ringM.position.set(0, 0.025, -0.46); g.add(ringM);
  return g;
}
function buildHero(id){
  var g = new THREE.Group();
  var P = {};
  var M = {};
  if (id === 'joker'){
    M.suit = mat(0x232031, 0.55, 0.1);
    M.skin = mat(0xF3EFE4, 0.5, 0);
    M.hand = M.skin; M.shoe = mat(0x17161D, 0.5, 0.1);
    M.trim = mat(0xFF4FD8, 0.4, 0, 0xFF4FD8, 1.5);
    M.trim2 = mat(0x8A4FFF, 0.4, 0, 0x8A4FFF, 1.3);
    M.gunAccent = M.trim;
  } else if (id === 'shadow'){
    M.suit = mat(0x141519, 0.5, 0.25);
    M.skin = mat(0x141519, 0.5, 0.25);
    M.hand = M.skin; M.shoe = mat(0x0E0F12, 0.5, 0.2);
    M.trim = mat(0x59F2FF, 0.35, 0, 0x59F2FF, 1.6);
    M.armor = mat(0x2B2C34, 0.45, 0.4);
    M.gunAccent = mat(0x8A8F9A, 0.4, 0.5);
  } else if (id === 'pharaoh'){
    M.suit = mat(0xF1ECDD, 0.55, 0.05);
    M.skin = mat(0xD9A86C, 0.6, 0);
    M.hand = M.skin; M.shoe = mat(0xC9A227, 0.35, 0.6);
    M.gold = mat(0xC9A227, 0.28, 0.75);
    M.gem = mat(0x3A6FD8, 0.3, 0, 0x3A6FD8, 1.5);
    M.gunAccent = M.gold;
  } else { // agent
    M.suit = mat(0xEFEDE6, 0.55, 0.05);
    M.skin = mat(0xE6BD96, 0.6, 0);
    M.dark = mat(0x141416, 0.5, 0.1);
    M.hand = M.dark; M.shoe = M.dark;
    M.gunAccent = mat(0xC9A227, 0.3, 0.6);
  }

  /* ---- articulated smooth rig ---- */
  function leg(x){
    var hip = new THREE.Group(); hip.position.set(x, 0.98, 0); g.add(hip);
    hip.add(capsuleLimb(0.088, 0.36, M.suit));
    var knee = new THREE.Group(); knee.position.set(0, -0.38, 0); hip.add(knee);
    knee.add(capsuleLimb(0.064, 0.34, M.suit));
    var foot = sph(0.085, M.shoe, 0, -0.70, -0.06); foot.scale.set(1, 0.6, 1.75); knee.add(foot);
    return hip;
  }
  P.legL = leg(-0.11); P.legR = leg(0.11);
  var torsoG = new THREE.Group(); torsoG.position.set(0, 0.98, 0); g.add(torsoG);
  P.torso = cyl(0.205, 0.148, 0.56, M.suit, 0, 0.28, 0, 18); torsoG.add(P.torso);
  var shBar = cyl(0.07, 0.07, 0.52, M.suit, 0, 0.5, 0, 10);
  shBar.rotation.z = Math.PI/2; torsoG.add(shBar);
  torsoG.add(sph(0.07, M.suit, -0.26, 0.5, 0, 10, 8));
  torsoG.add(sph(0.07, M.suit, 0.26, 0.5, 0, 10, 8));
  function arm(x){
    var sh = new THREE.Group(); sh.position.set(x, 1.48, 0); g.add(sh);
    sh.add(capsuleLimb(0.062, 0.28, M.suit));
    var el = new THREE.Group(); el.position.set(0, -0.30, 0); sh.add(el);
    el.add(capsuleLimb(0.052, 0.26, M.suit));
    el.add(sph(0.068, M.hand, 0, -0.30, 0, 10, 8));
    return { sh: sh, el: el };
  }
  var aL = arm(-0.28), aR = arm(0.28);
  P.armL = aL.sh; P.armR = aR.sh;
  torsoG.add(cyl(0.055, 0.062, 0.1, M.skin, 0, 0.60, 0, 10));
  P.head = sph(0.155, M.skin, 0, 0.74, 0, 18, 14); torsoG.add(P.head);

  /* ---- hero costumes ---- */
  if (id === 'joker'){
    torsoG.add(cyl(0.225, 0.27, 0.5, M.suit, 0, 0.26, 0, 18));      // coat torso
    torsoG.add(cyl(0.27, 0.44, 0.66, M.suit, 0, -0.28, 0.02, 18));  // coat skirt
    var hem = wrapRing(0.435, 0.016, M.trim); hem.position.set(0, -0.60, 0.02); torsoG.add(hem);
    var collar = wrapRing(0.17, 0.05, M.suit); collar.position.set(0, 0.58, 0); collar.rotation.x = 1.1; torsoG.add(collar);
    torsoG.add(box(0.025, 0.5, 0.02, M.trim, -0.1, 0.2, -0.24));
    torsoG.add(box(0.025, 0.5, 0.02, M.trim2, 0.1, 0.2, -0.24));
    torsoG.add(sph(0.024, M.trim2, -0.058, 0.76, -0.128, 8, 8));    // mask eyes
    torsoG.add(sph(0.024, M.trim2, 0.058, 0.76, -0.128, 8, 8));
    var grin = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.009, 8, 14, Math.PI), M.trim2);
    grin.position.set(0, 0.70, -0.135); grin.rotation.z = Math.PI; torsoG.add(grin);
    var hair = new THREE.Mesh(new THREE.SphereGeometry(0.168, 14, 10, 0, Math.PI*2, 0, 1.85), mat(0x101018, 0.6, 0));
    hair.position.set(0, 0.755, 0.018); torsoG.add(hair);
    var cuffL = wrapRing(0.062, 0.012, M.trim); cuffL.position.set(0, -0.22, 0); aL.el.add(cuffL);
    var cuffR = wrapRing(0.062, 0.012, M.trim); cuffR.position.set(0, -0.22, 0); aR.el.add(cuffR);
  } else if (id === 'shadow'){
    torsoG.add(cyl(0.215, 0.16, 0.42, M.armor, 0, 0.30, 0, 18));    // chest armor
    torsoG.add(box(0.21, 0.05, 0.03, M.trim, 0, 0.76, -0.135));     // visor
    var belt = wrapRing(0.165, 0.032, M.armor); belt.position.set(0, 0.02, 0); torsoG.add(belt);
    var seamL = wrapRing(0.09, 0.008, M.armor); seamL.position.set(0, -0.12, 0); P.legL.add(seamL);
    var seamR = wrapRing(0.09, 0.008, M.armor); seamR.position.set(0, -0.12, 0); P.legR.add(seamR);
    var padL = sph(0.075, M.armor, 0, -0.36, -0.05, 10, 8); padL.scale.set(1, 1, 0.7); P.legL.add(padL);
    var padR = sph(0.075, M.armor, 0, -0.36, -0.05, 10, 8); padR.scale.set(1, 1, 0.7); P.legR.add(padR);
  } else if (id === 'pharaoh'){
    torsoG.add(cyl(0.225, 0.175, 0.44, M.gold, 0, 0.30, 0, 18));     // chest plate

  function mleg(x){

    hip.add(capsuleLimb(0.085, 0.34, flesh));

  var wb1 = wrapRing(0.165, 0.028, wrapM); wb1.position.set(0, 0.10, 0); torsoG.add(wb1);

  }
  var armL = marm(-0.27), armR = marm(0.27);

  var headG = new THREE.Group(); headG.position.set(0, 0.66, -0.05); torsoG.add(headG);

  var band = wrapRing(0.152, 0.032, wrapM); band.position.set(0, 0.03, 0); band.rotation.z = 0.35; headG.add(band);
  var face = sph(0.125, darkM, 0, -0.015, -0.055, 12, 10); face.scale.set(0.82, 0.92, 0.62); headG.add(face);
  headG.add(sph(0.032, eyeM, -0.055, 0.035, -0.148, 8, 8));

  var hstrip = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.2),

  hstrip.position.set(0.1, -0.12, 0.06); hstrip.rotation.set(0.4, 0, 0.5); headG.add(hstrip);

  g.add(blobShadow(0.5));

  return { group:g, legL:legL, legR:legR, armL:armL, armR:armR,

function spawnEnemy(){
  var e = buildMummy();
  var a = Math.random()*Math.PI*2, d = 11 + Math.random()*4;
  e.x = Math.max(-13, Math.min(13, player.x + Math.cos(a)*d));
  e.z = Math.max(-14, Math.min(13, player.z + Math.sin(a)*d * 0.7));
  e.speed = 1.05 + level*0.1 + Math.random()*0.35;
  e.group.position.set(e.x, 0, e.z);
  enemies.push(e);
}
function removeEnemy(e){
  scene.remove(e.group);
  var i = enemies.indexOf(e);
  if (i >= 0) enemies.splice(i, 1);
}
function enemyMeshes(){
  var out = [];
  for (var i=0;i<enemies.length;i++){
    if (enemies[i].dying) continue;
    enemies[i].group.traverse(function(o){
      if (o.isMesh){ o.userData.enemy = enemies[i]; out.push(o); }
    });
  }
  return out;
}

/* ================= effects ================= */
function burst(pos, colorHex, n){
  var col = new THREE.Color(colorHex);
  for (var i=0;i<n;i++){
    var m = new THREE.Mesh(particleGeo,
      new THREE.MeshBasicMaterial({ color:col.clone(), transparent:true }));
    m.position.copy(pos);
    var a = Math.random()*Math.PI*2;
    particles.push({ mesh:m,
      vx: Math.cos(a)*(1.5+Math.random()*2.5),
      vy: 1.5+Math.random()*2.5,
      vz: Math.sin(a)*(1.5+Math.random()*2.5),
      life: 0.7, maxLife: 0.7 });
    scene.add(m);
  }
}
function popup(text, gold){
  var d = document.createElement('div');
  d.className = 'scorepop' + (gold ? ' gold' : '');
  d.textContent = text;
  d.style.left = (VW/2 - 24) + 'px'; d.style.top = (VH/2 - 70) + 'px';

function updateHUD(){
  scoreV.textContent = score;
  bestV.textContent = 'BEST ' + Math.max(best, score);
  var tl = Math.max(0, Math.ceil(GAME_LEN - elapsed));
  timeV.textContent = Math.floor(tl/60) + ':' + ('0' + (tl%60)).slice(-2);
  levelV.textContent = 'LV ' + level;
  hpfill.style.width = Math.max(0, hp) + '%';
  hpfill.style.background = hp > 50 ? '#3E9B4F' : (hp > 25 ? '#D9A441' : '#C0392B');
  if (combo >= 2){
    comboTag.textContent = 'COMBO ×' + combo;
    comboTag.style.opacity = 1;
  } else comboTag.style.opacity = 0;
}

/* ================= combat ================= */
function fire(){
  if (state !== 'playing' || paused || !threeOK) return;
  var now = performance.now();
  if (now - lastShot < 180) return;
  lastShot = now;
  audio();
  sfx.shoot();
  recoil = 1; flashT = 0.06;
  var P = hero.parts;
  P.flashMesh.visible = true;
  P.flashLight.intensity = 2.4;
  crosshair.style.transform = 'scale(1.35)';
  setTimeout(function(){ crosshair.style.transform = 'scale(1)'; }, 90);
  raycaster.setFromCamera(CENTER2, camera);
  var hits = raycaster.intersectObjects(enemyMeshes());
  if (hits.length > 0){
    var h = hits[0], e = h.object.userData.enemy;
    if (!e || e.dying) return;
    burst(h.point, 0xD9A41B, 10);
    e.hp--;
    var kdx = e.x - player.x, kdz = e.z - player.z, kd = Math.hypot(kdx, kdz) || 1;
    e.x += kdx/kd*0.6; e.z += kdz/kd*0.6;
    e.hitFlash = 0.12;
    for (var fi=0;fi<e.flashMats.length;fi++){ e.flashMats[fi].emissive.setHex(0xFF2222); e.flashMats[fi].emissiveIntensity = 0.8; }
    combo++; comboT = 0;
    var pts = 10;
    if (e.hp <= 0){
      e.dying = true; e.dieT = 0;
      burst(h.point, 0xB4452F, 14);
      pts = 25 + (combo >= 2 ? (combo-1)*5 : 0);
      popup('+' + pts, combo >= 3);
      sfx.kill(combo);
    } else {
      sfx.hit();
    }
    score += pts;
  } else {
    combo = 0;
  }
  updateHUD();
}
function hurtPlayer(dmg){
  if (state !== 'playing') return;
  hp -= dmg;
  lastDmgT = elapsed;
  combo = 0;
  dmgflash.style.opacity = 1;
  setTimeout(function(){ dmgflash.style.opacity = 0; }, 220);
  sfx.hurt();
  updateHUD();
  if (hp <= 0){ hp = 0; gameOver('YOU DIED'); }
}

/* ================= update ================= */
function update(dt){
  elapsed += dt;
  comboT += dt;
  if (comboT > 3) combo = 0;
  var nl = 1 + Math.floor(elapsed/15);
  if (nl !== level){ level = nl; sfx.level(); }
  if (elapsed >= GAME_LEN){ gameOver('TIME UP'); return; }
  if (elapsed - lastDmgT > 4 && hp < 100) hp = Math.min(100, hp + 5*dt);

  // movement
  var mx = joy.dx/48, my = joy.dy/48;
  var len = Math.hypot(mx, my);
  if (len > 1){ mx/=len; my/=len; }
  var moving = len > 0.12;
  if (moving){
    var sp = 4.4;
    var sin = Math.sin(yaw), cos = Math.cos(yaw);
    player.x += (cos*mx + sin*my)*sp*dt;
    player.z += (-sin*mx + cos*my)*sp*dt;
    player.x = Math.max(-8, Math.min(8, player.x));
    player.z = Math.max(-2, Math.min(12, player.z));
    walkPhase += dt*11;
  }
  // hero pose
  var HP = hero.parts;
  hero.group.position.set(player.x, 0, player.z);
  hero.group.rotation.y = yaw;
  var sw = moving ? Math.sin(walkPhase)*0.55 : 0;
  HP.legL.rotation.x = sw; HP.legR.rotation.x = -sw;
  HP.armL.rotation.x = -sw*0.7; HP.armR.rotation.x = -0.5 + sw*0.15;
  // third-person camera
  var fx = -Math.sin(yaw)*Math.cos(pitch),
      fy = Math.sin(pitch),
      fz = -Math.cos(yaw)*Math.cos(pitch);
  var cx = player.x - fx*3.8, cy = 2.1 - fy*3.8, cz = player.z - fz*3.8;
  if (cy < 0.7) cy = 0.7;
  camera.position.set(cx, cy, cz);
  camera.lookAt(player.x + fx*8, 1.5 + fy*8, player.z + fz*8);

  // enemies
  spawnT -= dt;
  var want = Math.min(3 + level, 8);
  if (spawnT <= 0 && enemies.length < want){ spawnEnemy(); spawnT = 1.7; }
  var i, e, dx, dz, dist;
  for (i=enemies.length-1;i>=0;i--){
    e = enemies[i];
    if (e.dying){
      e.dieT += dt;
      e.group.rotation.x = -Math.min(1.4, e.dieT*4);
      e.group.position.y = -Math.max(0, e.dieT-0.5)*1.2;
      if (e.dieT > 0.9) removeEnemy(e);
      continue;
    }
    if (e.hitFlash > 0){
      e.hitFlash -= dt;
      if (e.hitFlash <= 0) for (var fi2=0;fi2<e.flashMats.length;fi2++){ e.flashMats[fi2].emissive.setHex(0x000000); e.flashMats[fi2].emissiveIntensity = 0; }
    }
    dx = player.x - e.x; dz = player.z - e.z;
    dist = Math.hypot(dx, dz);
    // separation
    for (var j=0;j<enemies.length;j++){
      if (j === i) continue;
      var o = enemies[j];
      var sx = e.x - o.x, sz = e.z - o.z, sd = Math.hypot(sx, sz);
      if (sd > 0.01 && sd < 0.9){ e.x += sx/sd*dt*1.5; e.z += sz/sd*dt*1.5; }
    }
    if (dist > 1.35){
      e.x += dx/dist*e.speed*dt;
      e.z += dz/dist*e.speed*dt;
      e.walkPhase += dt*7;
      var w = Math.sin(e.walkPhase)*0.5;
      e.legL.rotation.x = w; e.legR.rotation.x = -w;
    } else {
      e.atkCd -= dt;
      e.legL.rotation.x *= 0.9; e.legR.rotation.x *= 0.9;
      if (e.atkCd <= 0){
        e.atkCd = 1.45;
        e.armL.rotation.x = -1.6; e.armR.rotation.x = -1.6;
        hurtPlayer(8);
      }
    }
    e.group.rotation.y = Math.atan2(-dx, -dz);
    e.group.position.set(e.x, 0, e.z);
    // attack arms recover
    if (e.atkCd < 0.8){ e.armL.rotation.x += (-0.95 - e.armL.rotation.x)*dt*6; e.armR.rotation.x += (-0.95 - e.armR.rotation.x)*dt*6; }
  }
  // particles
  for (i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){
      scene.remove(p.mesh); p.mesh.material.dispose();
      particles.splice(i, 1); continue;
    }
    p.vy -= 7*dt;
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt;
    p.mesh.position.z += p.vz*dt;
    p.mesh.material.opacity = p.life/p.maxLife;
    var k = p.life/p.maxLife;
    p.mesh.scale.set(k, k, k);
  }
  // gun recoil + flash
  if (recoil > 0){
    recoil = Math.max(0, recoil - dt*7);
    HP.gun.position.z = -0.3 + recoil*0.08;
    HP.gun.rotation.x = recoil*0.1;
  }
  if (flashT > 0){
    flashT -= dt;
    if (flashT <= 0){ HP.flashMesh.visible = false; HP.flashLight.intensity = 0; }
  }
  updateHUD();
}

/* ================= loop ================= */
var lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  var dt = Math.min((t-lastT)/1000, 0.05);
  lastT = t;
  if (state === 'playing' && !paused && threeOK) update(dt);
  if (renderer) renderer.render(scene, camera);
}

/* ================= flow ================= */
function startGame(){
  if (!threeOK) return;
  state = 'playing';
  paused = false;
  score = 0; combo = 0; comboT = 0; level = 1; elapsed = 0; spawnT = 0;
  hp = 100; lastDmgT = -99;
  yaw = 0; pitch = -0.05;
  player.x = 0; player.z = 8;
  for (var i=enemies.length-1;i>=0;i--) removeEnemy(enemies[i]);
  for (var k=particles.length-1;k>=0;k--){ scene.remove(particles[k].mesh); }
  particles = [];
  if (hero){ scene.remove(hero.group); }
  hero = buildHero(HEROS[heroIdx].id);
  overlayEl.classList.add('hidden');
  pauseBtn.classList.remove('hidden');
  rotBtn.classList.remove('hidden');
  fireBtn.classList.remove('hidden');
  crosshair.classList.remove('hidden');
  for (var s=0;s<3;s++) spawnEnemy();
  updateHUD();
}
function gameOver(reason){
  state = 'gameover';
  overReason = reason;
  sfx.over();
  var isBest = score > best;
  if (isBest){ best = score; store.set('best', String(best)); }
  pauseBtn.classList.add('hidden');
  rotBtn.classList.add('hidden');
  fireBtn.classList.add('hidden');
  crosshair.classList.add('hidden');
  overlayEl.classList.remove('hidden');
  overlayEl.innerHTML =
    '<div class="sub">'+reason+'</div>' +
    '<h1>'+score+'</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">SCORE</div>' +
    '<div id="stat">BEST <b>'+best+'</b>'+(isBest ? ' &nbsp;·&nbsp; NEW!' : '')+'</div>' +
    '<br><button class="btn solid" id="bAgain">↻ PLAY AGAIN</button>' +
    '<button class="btn" id="bMenu">MENU</button>' +
    '<button class="btn" id="bHome">🏠 HOME</button>';
  wireButton('bAgain', function(){ startGame(); });
  wireButton('bMenu', function(){ showMenu(); });
  wireButton('bHome', function(){ window.location.href = 'index.html'; });
}
function wireButton(id, fn){
  var b = document.getElementById(id);
  if (b) b.addEventListener('click', function(){ sfx.click(); fn(); });
}
function showMenu(){
  state = 'menu';
  paused = false;
  pauseBtn.classList.add('hidden');
  rotBtn.classList.add('hidden');
  fireBtn.classList.add('hidden');
  crosshair.classList.add('hidden');
  overlayEl.classList.remove('hidden');
  var err = threeOK ? '' : '<div class="err">3D ke liye internet chahiye (three.js load nahi hua). WiFi/data on karke dobara kholo.</div>';
  overlayEl.innerHTML =
    '<h1>ZOMBIE<br>HUNT</h1>' +
    '<div class="rule"></div>' +
    '<div class="howto">Mummy zombies aa rahe hain!<br>Joystick: chalo &nbsp;·&nbsp; Drag: aim &nbsp;·&nbsp; FIRE: shoot<br>Zinda raho, zyada se zyada maaro 🧟</div>' +
    err +
    '<button class="btn solid" id="bStart">START</button>' +
    '<button class="btn" id="bOpt">OPTIONS</button>' +
    '<button class="btn" id="bHome">🏠 HOME</button>';
  wireButton('bStart', function(){ startGame(); });
  wireButton('bOpt', function(){ showOptions(); });
  wireButton('bHome', function(){ window.location.href = 'index.html'; });
}
function showOptions(){
  state = 'options';
  overlayEl.classList.remove('hidden');
  overlayEl.innerHTML =
    '<h1>OPTIONS</h1><div class="rule"></div>' +
    '<div class="opt-row"><span class="label">SOUND</span>' +
      '<button class="val" id="oSound">'+(soundOn ? 'ON' : 'OFF')+'</button></div>' +
    '<div class="opt-row"><span class="label">HERO</span>' +
      '<button class="val" id="oHero">'+HEROS[heroIdx].icon+' '+HEROS[heroIdx].name+'</button></div>' +
    '<div class="opt-row"><span class="label">ROTATE</span>' +
      '<button class="val" id="oOrient">'+orientLabel()+'</button></div>' +
    '<br><button class="btn solid" id="bBack">BACK</button>';
  wireButton('oSound', function(){
    soundOn = !soundOn;
    store.set('sound', soundOn ? 'on' : 'off');
    document.getElementById('oSound').textContent = soundOn ? 'ON' : 'OFF';
  });
  wireButton('oHero', function(){
    heroIdx = (heroIdx + 1) % HEROS.length;
    store.set('hero', String(heroIdx));
    document.getElementById('oHero').textContent = HEROS[heroIdx].icon+' '+HEROS[heroIdx].name;
  });
  wireButton('oOrient', function(){ toggleOrient(); });
  wireButton('bBack', function(){ showMenu(); });
}
function doPause(){
  if (state !== 'playing' || paused) return;
  paused = true;
  overlayEl.classList.remove('hidden');
  overlayEl.innerHTML =
    '<h1>PAUSED</h1><div class="rule"></div>' +
    '<button class="btn solid" id="bResume">RESUME</button>' +
    '<button class="btn" id="bMenu">MENU</button>' +
    '<button class="btn" id="bHome">🏠 HOME</button>';
  wireButton('bResume', function(){
    paused = false;
    overlayEl.classList.add('hidden');
  });
  wireButton('bMenu', function(){ showMenu(); });
  wireButton('bHome', function(){ window.location.href = 'index.html'; });
}

/* ================= input ================= */
pauseBtn.addEventListener('click', function(){ sfx.click(); doPause(); });
rotBtn.addEventListener('click', function(){ sfx.click(); toggleOrient(); });
fireBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); fire(); });
document.addEventListener('touchstart', function(e){
  if (state !== 'playing' || paused) return;
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.target === fireBtn || t.target === pauseBtn || t.target === rotBtn) continue;
    var p = mapPt(t.clientX, t.clientY);
    if (p.x < VW*0.45 && joy.id === null){
      joy.id = t.identifier; joy.ox = p.x; joy.oy = p.y;
      joy.dx = 0; joy.dy = 0;
      joyBase.style.display = 'block'; joyNub.style.display = 'block';
      joyBase.style.left = p.x+'px'; joyBase.style.top = p.y+'px';
      joyNub.style.left = p.x+'px'; joyNub.style.top = p.y+'px';
    } else if (look.id === null){
      look.id = t.identifier; look.lx = p.x; look.ly = p.y;
    }
  }
}, { passive:false });
document.addEventListener('touchmove', function(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    var mp = mapPt(t.clientX, t.clientY);
    if (t.identifier === joy.id){
      joy.dx = mp.x - joy.ox; joy.dy = mp.y - joy.oy;
      var l = Math.hypot(joy.dx, joy.dy);
      if (l > 48){ joy.dx = joy.dx/l*48; joy.dy = joy.dy/l*48; }
      joyNub.style.left = (joy.ox + joy.dx)+'px';
      joyNub.style.top = (joy.oy + joy.dy)+'px';
    } else if (t.identifier === look.id){
      yaw -= (mp.x - look.lx)*0.0052;
      pitch -= (mp.y - look.ly)*0.0042;
      pitch = Math.max(-0.55, Math.min(0.5, pitch));
      look.lx = mp.x; look.ly = mp.y;
    }
  }
  if (state === 'playing' && !paused) e.preventDefault();
}, { passive:false });
function endTouch(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.identifier === joy.id){
      joy.id = null; joy.dx = 0; joy.dy = 0;
      joyBase.style.display = 'none'; joyNub.style.display = 'none';
    }
    if (t.identifier === look.id) look.id = null;
  }
}
document.addEventListener('touchend', endTouch);
document.addEventListener('touchcancel', endTouch);
var keys = {};
document.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); fire(); }
  if (e.code === 'Escape' && state === 'playing') doPause();
  keys[e.code] = true;
});
document.addEventListener('keyup', function(e){ keys[e.code] = false; });
var mouseDown = false, mLX = 0, mLY = 0;
document.addEventListener('mousedown', function(e){
  if (state !== 'playing' || paused) return;
  var pm = mapPt(e.clientX, e.clientY);
  mouseDown = true; mLX = pm.x; mLY = pm.y;
});
document.addEventListener('mousemove', function(e){
  if (!mouseDown || state !== 'playing' || paused) return;
  var qm = mapPt(e.clientX, e.clientY);
  yaw -= (qm.x - mLX)*0.004;
  pitch -= (qm.y - mLY)*0.0032;
  pitch = Math.max(-0.55, Math.min(0.5, pitch));
  mLX = qm.x; mLY = qm.y;
});
document.addEventListener('mouseup', function(){ mouseDown = false; });
// WASD movement
setInterval(function(){
  if (state !== 'playing' || paused) return;
  var mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) my += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if (mx || my){ joy.dx = mx*48; joy.dy = my*48; joy.id = 'kbd'; }
  else if (joy.id === 'kbd'){ joy.id = null; joy.dx = 0; joy.dy = 0; }
}, 50);

/* ================= boot ================= */
if (threeOK) initThree();
if (threeOK) hero = buildHero(HEROS[heroIdx].id);
applyOrient();
showMenu();
requestAnimationFrame(loop);
})();
</script>
