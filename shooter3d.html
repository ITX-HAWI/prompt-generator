<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>3D Target Shoot</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#F7F4EE; color:#1E1B16;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; }
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none;
  }
  #hud .col { display:flex; flex-direction:column; align-items:center; min-width:70px; }
  #hud .label { font-size:10px; font-weight:700; letter-spacing:3px; color:rgba(30,27,22,.5); }
  #hud .big { font-size:30px; font-weight:800; color:#1E1B16; line-height:1.1; }
  #hud .sub2 { font-size:12px; font-weight:700; letter-spacing:1px; color:#A8822F; }
  #comboTag {
    position:fixed; top:86px; left:0; right:0; z-index:2; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:3px; color:#A8822F;
    pointer-events:none; opacity:0; transition:opacity .2s;
  }
  #pauseBtn {
    position:fixed; top:14px; left:14px; z-index:4;
    width:44px; height:44px; border-radius:50%;
    font-size:14px; color:#1E1B16; cursor:pointer; font-family:inherit;
    background:rgba(247,244,238,.85); border:1.5px solid #1E1B16;
  }
  #pauseBtn:active { transform:scale(.92); }
  #pauseBtn.hidden { display:none; }
  .tapflash {
    position:fixed; z-index:3; width:54px; height:54px; margin:-27px 0 0 -27px;
    border:2px solid #A8822F; border-radius:50%; pointer-events:none;
    animation:flash .35s ease-out forwards;
  }
  @keyframes flash {
    from { transform:scale(.4); opacity:.9; }
    to { transform:scale(1.6); opacity:0; }
  }
  .scorepop {
    position:fixed; z-index:3; pointer-events:none;
    font-size:20px; font-weight:800; color:#1E1B16;
    animation:rise .8s ease-out forwards;
  }
  .scorepop.gold { color:#A8822F; font-size:26px; }
  @keyframes rise {
    from { transform:translateY(0); opacity:1; }
    to { transform:translateY(-52px); opacity:0; }
  }
  #overlay {
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(247,244,238,.96);
    text-align:center; padding:20px;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:38px; font-weight:800; letter-spacing:8px; padding-left:8px;
    color:#1E1B16; margin-bottom:12px;
  }
  #overlay .rule { width:56px; height:2px; background:#A8822F; margin:0 auto 22px; }
  #overlay .sub { font-size:13px; color:rgba(30,27,22,.55); letter-spacing:4px; margin-bottom:26px; }
  #overlay .err { font-size:14px; color:#a33; max-width:300px; line-height:1.5; margin-bottom:20px; }
  .btn {
    display:block; width:230px; margin:9px auto; padding:14px 0 14px 4px;
    font-size:16px; font-weight:700; letter-spacing:4px; color:#1E1B16;
    background:transparent; border:1.5px solid #1E1B16; border-radius:12px;
    cursor:pointer; transition:transform .1s ease; font-family:inherit;
  }
  .btn:active { transform:scale(.96); }
  .btn.solid { background:#1E1B16; color:#F7F4EE; }
  .opt-row { display:flex; align-items:center; justify-content:space-between; width:280px; margin:12px auto; }
  .opt-row .label { font-size:15px; letter-spacing:2px; color:rgba(30,27,22,.65); }
  .opt-row .val {
    min-width:130px; padding:10px 0; font-size:15px; font-weight:700; letter-spacing:2px;
    border:1.5px solid #A8822F; border-radius:10px; color:#1E1B16; cursor:pointer;
    background:transparent; font-family:inherit;
  }
  #stat { margin-top:18px; font-size:14px; letter-spacing:2px; color:rgba(30,27,22,.6); }
  #stat b { color:#A8822F; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div class="col" style="min-width:44px"></div>
  <div class="col">
    <div class="label">SCORE</div>
    <div class="big" id="scoreV">0</div>
    <div class="sub2" id="bestV">BEST 0</div>
  </div>
  <div class="col">
    <div class="label">TIME</div>
    <div class="big" id="timeV">1:00</div>
    <div class="sub2" id="levelV">LV 1</div>
  </div>
</div>
<div id="comboTag"></div>
<button id="pauseBtn" class="hidden">&#10074;&#10074;</button>
<div id="overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ================= settings ================= */
var store = {
  get: function(k, d){ try { var v = localStorage.getItem('shooter3d_'+k); return v === null ? d : v; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem('shooter3d_'+k, v); } catch(e){} }
};
var soundOn = store.get('sound', 'on') === 'on';
var best = parseInt(store.get('best', '0'), 10) || 0;

var overlayEl = document.getElementById('overlay');
var scoreV = document.getElementById('scoreV');
var bestV = document.getElementById('bestV');
var timeV = document.getElementById('timeV');
var levelV = document.getElementById('levelV');
var comboTag = document.getElementById('comboTag');
var pauseBtn = document.getElementById('pauseBtn');
var W = window.innerWidth, H = window.innerHeight;

/* ================= audio ================= */
var AC = null, master = null;
function audio(){
  if (!soundOn) return null;
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch(e){ return null; }
}
function tone(freq, dur, type, vol, slideTo, delay){
  var ac = audio(); if (!ac) return;
  var t = ac.currentTime + (delay || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
var sfx = {
  click:  function(){ tone(620, 0.06, 'square', 0.18); },
  shoot:  function(){ tone(950, 0.07, 'square', 0.16, 320); },
  hit:    function(combo){ var c = Math.min(combo, 10); tone(520 + c*45, 0.12, 'sine', 0.5, 780 + c*45); },
  gold:   function(){ tone(880, 0.14, 'sine', 0.5, 1320); tone(1320, 0.18, 'sine', 0.4, null, 0.08); },
  expire: function(){ tone(210, 0.14, 'sine', 0.22, 140); },
  level:  function(){ var n=[523,659,784]; for (var i=0;i<n.length;i++) tone(n[i], 0.14, 'sine', 0.4, null, i*0.09); },
  over:   function(){ tone(300, 0.5, 'sawtooth', 0.32, 80); }
};

/* ================= state ================= */
var state = 'menu'; // menu | options | playing | gameover
var paused = false;
var score = 0, combo = 0, level = 1, elapsed = 0, spawnT = 0;
var GAME_LEN = 60;
var COLORS = ['#C96F4A','#D9A441','#8A9B6E','#6FA3A0','#7C8DB0','#B57E97','#A08BC7','#C98F5F'];
var GOLD_C = '#C9A227';

/* ================= three.js ================= */
var scene = null, camera = null, renderer = null, raycaster = null;
var targets = [];    // {mesh, gold, life, baseY, bob, spin, drift}
var particles = [];  // {mesh, vx,vy,vz, life, maxLife}
var threeOK = (typeof THREE !== 'undefined');
var particleGeo = null;

function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xF7F4EE);
  scene.fog = new THREE.Fog(0xF7F4EE, 9, 24);
  camera = new THREE.PerspectiveCamera(62, W/H, 0.1, 60);
  camera.position.set(0, 2.4, 7.5);
  camera.lookAt(0, 1.5, -2);
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('scene').appendChild(renderer.domElement);
  raycaster = new THREE.Raycaster();
  particleGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);

  var hemi = new THREE.HemisphereLight(0xfffbf0, 0xd8cdb8, 0.75);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(4, 7, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
  sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -4;
  sun.shadow.camera.far = 25;
  scene.add(sun);

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({ color:0xECE4D2, roughness:1 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // distant ink silhouettes for depth
  var silMat = new THREE.MeshStandardMaterial({ color:0x2A251D, roughness:1 });
  var silPos = [[-7,1.2,-13,1.6],[6.5,0.9,-12,1.2],[-3,1.8,-15,2.2],[3.5,1.1,-14,1.4],[0,2.4,-17,2.8]];
  for (var i=0;i<silPos.length;i++){
    var s = silPos[i];
    var m = new THREE.Mesh(new THREE.BoxGeometry(s[3], s[1]*2, s[3]), silMat);
    m.position.set(s[0], s[1], s[2]);
    scene.add(m);
  }
  window.addEventListener('resize', onResize);
}
function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  if (!renderer) return;
  camera.aspect = W/H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
}

/* ================= targets & effects ================= */
function spawnTarget(){
  var kinds = ['box','sphere','cyl','torus'];
  var kind = kinds[(Math.random()*kinds.length)|0];
  var gold = Math.random() < 0.12;
  var color = gold ? GOLD_C : COLORS[(Math.random()*COLORS.length)|0];
  var s = 0.34 + Math.random()*0.24, geo;
  if (kind === 'box') geo = new THREE.BoxGeometry(s, s, s);
  else if (kind === 'sphere') geo = new THREE.SphereGeometry(s*0.62, 20, 16);
  else if (kind === 'cyl') geo = new THREE.CylinderGeometry(s*0.5, s*0.5, s*0.42, 20);
  else geo = new THREE.TorusGeometry(s*0.5, s*0.17, 12, 24);
  var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: color, roughness: 0.5, metalness: gold ? 0.45 : 0.08
  }));
  mesh.castShadow = true;
  var x = (Math.random()*2-1)*3.4;
  var y = 0.7 + Math.random()*2.4;
  var z = -1.6 - Math.random()*4.4;
  mesh.position.set(x, y, z);
  scene.add(mesh);
  var life = Math.max(2.4, 4.6 + Math.random()*2 - level*0.25);
  var t = { mesh:mesh, gold:gold, life:life, maxLife:life,
            baseY:y, bob:Math.random()*6.28,
            spin:(Math.random()*2-1)*1.4, drift:(Math.random()*2-1)*0.4 };
  mesh.userData.target = t;
  targets.push(t);
}
function removeTarget(t){
  scene.remove(t.mesh);
  if (t.mesh.geometry) t.mesh.geometry.dispose();
  if (t.mesh.material) t.mesh.material.dispose();
  var i = targets.indexOf(t);
  if (i >= 0) targets.splice(i, 1);
}
function burst(pos, colorHex, n){
  var col = new THREE.Color(colorHex);
  for (var i=0;i<n;i++){
    var m = new THREE.Mesh(particleGeo,
      new THREE.MeshBasicMaterial({ color: col.clone(), transparent:true }));
    m.position.copy(pos);
    var a = Math.random()*Math.PI*2, up = Math.random()*2+1.5;
    var sp = 1.5 + Math.random()*2.5;
    particles.push({ mesh:m,
      vx: Math.cos(a)*sp, vy: up, vz: Math.sin(a)*sp,
      life: 0.7, maxLife: 0.7 });
    scene.add(m);
  }
}
function worldToScreen(v){
  var p = v.clone().project(camera);
  return { x:(p.x*0.5+0.5)*W, y:(-p.y*0.5+0.5)*H };
}
function popup(x, y, text, gold){
  var d = document.createElement('div');
  d.className = 'scorepop' + (gold ? ' gold' : '');
  d.textContent = text;
  d.style.left = (x-20) + 'px'; d.style.top = (y-14) + 'px';
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 850);
}
function tapFlash(x, y){
  var d = document.createElement('div');
  d.className = 'tapflash';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 400);
}
function updateHUD(){
  scoreV.textContent = score;
  bestV.textContent = 'BEST ' + Math.max(best, score);
  var tl = Math.max(0, Math.ceil(GAME_LEN - elapsed));
  timeV.textContent = Math.floor(tl/60) + ':' + ('0' + (tl%60)).slice(-2);
  levelV.textContent = 'LV ' + level;
  if (combo >= 2){
    comboTag.textContent = 'COMBO ×' + combo;
    comboTag.style.opacity = 1;
  } else comboTag.style.opacity = 0;
}

/* ================= shooting ================= */
function shoot(cx, cy){
  if (state !== 'playing' || paused || !threeOK) return;
  audio();
  sfx.shoot();
  tapFlash(cx, cy);
  var ndc = new THREE.Vector2((cx/W)*2 - 1, -(cy/H)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  var meshes = [];
  for (var i=0;i<targets.length;i++) meshes.push(targets[i].mesh);
  var hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0){
    var t = hits[0].object.userData.target;
    if (!t) return;
    burst(t.mesh.position, t.gold ? GOLD_C : t.mesh.material.color, t.gold ? 20 : 11);
    var sp = worldToScreen(t.mesh.position);
    removeTarget(t);
    combo++;
    var pts = t.gold ? 50 : 10;
    if (combo >= 2) pts += (combo-1)*5;
    score += pts;
    popup(sp.x, sp.y, '+' + pts, t.gold);
    if (t.gold) sfx.gold(); else sfx.hit(combo);
    updateHUD();
  }
}

/* ================= update ================= */
function update(dt){
  elapsed += dt;
  var nl = 1 + Math.floor(elapsed/15);
  if (nl !== level){ level = nl; sfx.level(); }
  if (elapsed >= GAME_LEN){ gameOver(); return; }
  spawnT -= dt;
  var maxT = Math.min(4 + level, 10);
  if (spawnT <= 0 && targets.length < maxT){
    spawnTarget();
    spawnT = Math.max(0.45, 1.35 - level*0.16);
  }
  var i, t, k;
  for (i=targets.length-1;i>=0;i--){
    t = targets[i];
    t.life -= dt;
    t.bob += dt*2.2;
    t.mesh.position.y = t.baseY + Math.sin(t.bob)*0.18;
    t.mesh.position.x += t.drift*dt;
    if (t.mesh.position.x > 3.9 || t.mesh.position.x < -3.9) t.drift *= -1;
    t.mesh.rotation.x += t.spin*dt;
    t.mesh.rotation.y += t.spin*0.7*dt;
    if (t.life < 0.6){
      k = Math.max(0.01, t.life/0.6);
      t.mesh.scale.set(k, k, k);
    }
    if (t.life <= 0){
      removeTarget(t);
      if (combo > 0){ combo = 0; }
      sfx.expire();
    }
  }
  for (i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){
      scene.remove(p.mesh); p.mesh.material.dispose();
      particles.splice(i, 1); continue;
    }
    p.vy -= 7*dt;
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt;
    p.mesh.position.z += p.vz*dt;
    if (p.mesh.position.y < 0.05){ p.mesh.position.y = 0.05; p.vy *= -0.4; }
    p.mesh.material.opacity = p.life/p.maxLife;
    k = p.life/p.maxLife;
    p.mesh.scale.set(k, k, k);
  }
  var ct = performance.now()/1000;
  camera.position.x = Math.sin(ct*0.35)*0.28;
  camera.position.y = 2.4 + Math.sin(ct*0.5)*0.08;
  camera.lookAt(0, 1.5, -2);
  updateHUD();
}

/* ================= loop ================= */
var lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  var dt = Math.min((t-lastT)/1000, 0.05);
  lastT = t;
  if (state === 'playing' && !paused && threeOK) update(dt);
  if (renderer) renderer.render(scene, camera);
}

/* ================= flow & menus ================= */
function clearWorld(){
  var i;
  for (i=targets.length-1;i>=0;i--) removeTarget(targets[i]);
  for (i=particles.length-1;i>=0;i--){
    scene.remove(particles[i].mesh); particles[i].mesh.material.dispose();
  }
  particles = [];
}
function startGame(){
  if (!threeOK) return;
  score = 0; combo = 0; level = 1; elapsed = 0; spawnT = 0.3; paused = false;
  clearWorld();
  state = 'playing';
  hideOverlay();
  pauseBtn.classList.remove('hidden');
  updateHUD();
  sfx.click();
}
function gameOver(){
  state = 'gameover';
  paused = false;
  pauseBtn.classList.add('hidden');
  if (score > best){ best = score; store.set('best', String(best)); }
  sfx.over();
  showGameOver();
}
function showPause(){
  if (state !== 'playing') return;
  paused = true;
  showOverlay(
    '<h1 style="font-size:32px">PAUSED</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">TAKE A BREATHER</div>' +
    '<button class="btn solid" data-act="resume">RESUME</button>' +
    '<button class="btn" data-act="menu">MENU</button>' +
    '<button class="btn" data-act="home">HOME</button>'
  );
}
function hideOverlay(){ overlayEl.classList.add('hidden'); }
function showOverlay(html){
  overlayEl.innerHTML = html;
  overlayEl.classList.remove('hidden');
  wireButtons();
}
function showMenu(){
  state = 'menu'; paused = false;
  pauseBtn.classList.add('hidden');
  var html =
    '<h1>TARGET<br>SHOOT</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">3D ARCADE SHOOTER</div>';
  if (!threeOK)
    html += '<div class="err">3D ke liye internet chahiye — library load nahi hui. Connection check kar ke page reload karo.</div>';
  html +=
    '<button class="btn solid" data-act="start">START</button>' +
    '<button class="btn" data-act="options">OPTIONS</button>' +
    '<button class="btn" data-act="exit">EXIT</button>' +
    '<div id="stat">BEST <b>' + best + '</b> &nbsp;·&nbsp; 60 SEC</div>';
  showOverlay(html);
}
function showOptions(){
  state = 'options';
  showOverlay(
    '<h1 style="font-size:30px">OPTIONS</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">TUNE YOUR GAME</div>' +
    '<div class="opt-row"><span class="label">SOUND</span>' +
      '<button class="val" data-act="sound">' + (soundOn ? 'ON' : 'OFF') + '</button></div>' +
    '<button class="btn" data-act="menu" style="margin-top:22px">BACK</button>'
  );
}
function showGameOver(){
  showOverlay(
    '<h1 style="font-size:34px">TIME UP</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">LEVEL ' + level + ' REACHED</div>' +
    '<div id="stat" style="font-size:20px; margin-bottom:14px">SCORE <b>' + score + '</b><br>BEST <b>' + best + '</b></div>' +
    '<button class="btn solid" data-act="start">RETRY</button>' +
    '<button class="btn" data-act="menu">MENU</button>'
  );
}
function wireButtons(){
  var btns = overlayEl.querySelectorAll('[data-act]');
  for (var i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var a = b.getAttribute('data-act');
        if (a === 'start') startGame();
        else if (a === 'options') showOptions();
        else if (a === 'menu') showMenu();
        else if (a === 'exit') window.location.href = 'index.html';
        else if (a === 'home') window.location.href = 'index.html';
        else if (a === 'resume'){ paused = false; hideOverlay(); }
        else if (a === 'sound'){
          soundOn = !soundOn; store.set('sound', soundOn ? 'on' : 'off');
          showOptions(); if (soundOn) sfx.click();
        }
      });
    })(btns[i]);
  }
}

/* ================= input ================= */
function evPos(e){
  if (e.touches && e.touches.length) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  return { x:e.clientX, y:e.clientY };
}
document.getElementById('scene').addEventListener('pointerdown', function(e){
  var p = evPos(e);
  shoot(p.x, p.y);
  if (e.cancelable) e.preventDefault();
});
document.getElementById('scene').addEventListener('touchstart', function(e){
  if (e.cancelable) e.preventDefault();
}, { passive:false });
pauseBtn.addEventListener('click', function(e){
  e.stopPropagation(); sfx.click(); showPause();
});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && state === 'playing'){
    if (paused){ paused = false; hideOverlay(); } else showPause();
  }
});
