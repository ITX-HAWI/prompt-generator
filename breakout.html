<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<title>Breakout</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#F7F4EE; color:#1E1B16;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display:block; width:100vw; height:100vh; }
  #overlay {
    position:fixed; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(247,244,238,.97);
    text-align:center; padding:20px;
  }
  #overlay.hidden { display:none; }
  #overlay h1 {
    font-size:44px; font-weight:800; letter-spacing:10px; padding-left:10px;
    color:#1E1B16; margin-bottom:12px;
  }
  #overlay .rule { width:56px; height:2px; background:#A8822F; margin:0 auto 22px; }
  #overlay .sub { font-size:13px; color:rgba(30,27,22,.55); letter-spacing:4px; margin-bottom:30px; }
  .btn {
    display:block; width:230px; margin:9px auto; padding:14px 0 14px 4px;
    font-size:16px; font-weight:700; letter-spacing:4px; color:#1E1B16;
    background:transparent; border:1.5px solid #1E1B16; border-radius:12px;
    cursor:pointer; transition:transform .1s ease;
  }
  .btn:active { transform:scale(.96); }
  .btn.solid { background:#1E1B16; color:#F7F4EE; }
  .opt-row { display:flex; align-items:center; justify-content:space-between; width:280px; margin:12px auto; }
  .opt-row .label { font-size:15px; letter-spacing:2px; color:rgba(30,27,22,.65); }
  .opt-row .val {
    min-width:130px; padding:10px 0; font-size:15px; font-weight:700; letter-spacing:2px;
    border:1.5px solid #A8822F; border-radius:10px; color:#1E1B16; cursor:pointer;
    background:transparent;
  }
  #stat { margin-top:18px; font-size:14px; letter-spacing:2px; color:rgba(30,27,22,.6); }
  #stat b { color:#A8822F; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>
<script>
(function(){
'use strict';

/* ================= setup ================= */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var overlayEl = document.getElementById('overlay');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var W = 0, H = 0;

/* ================= settings ================= */
var store = {
  get: function(k, d){ try { var v = localStorage.getItem('breakout_'+k); return v === null ? d : v; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem('breakout_'+k, v); } catch(e){} }
};
var soundOn = store.get('sound', 'on') === 'on';
var difficulty = store.get('diff', 'normal');
var best = parseInt(store.get('best', '0'), 10) || 0;
if (['easy','normal','hard'].indexOf(difficulty) < 0) difficulty = 'normal';

var DIFFS = {
  easy:   { paddleW: 120, ballSpeed: 340, label: 'EASY' },
  normal: { paddleW: 96,  ballSpeed: 420, label: 'NORMAL' },
  hard:   { paddleW: 74,  ballSpeed: 510, label: 'HARD' }
};

/* ================= audio (WebAudio, no assets) ================= */
var AC = null, master = null;
function audio(){
  if (!soundOn) return null;
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch(e){ return null; }
}
function tone(freq, dur, type, vol, slideTo){
  var ac = audio(); if (!ac) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
var sfx = {
  paddle: function(){ tone(220, 0.08, 'triangle', 0.6, 330); },
  wall:   function(){ tone(500, 0.05, 'sine', 0.3); },
  brick:  function(combo){ var c = Math.min(combo, 12); tone(440 + c*45, 0.09, 'square', 0.35, 880 + c*45); },
  hard:   function(){ tone(300, 0.07, 'sawtooth', 0.25, 200); },
  lose:   function(){ tone(300, 0.35, 'sawtooth', 0.4, 90); },
  clear:  function(){
    var notes = [523, 659, 784, 1047];
    for (var i = 0; i < notes.length; i++){
      (function(f, d){ setTimeout(function(){ tone(f, 0.16, 'triangle', 0.5); }, d); })(notes[i], i*110);
    }
  },
  over:   function(){ tone(220, 0.6, 'sawtooth', 0.4, 70); },
  launch: function(){ tone(330, 0.08, 'sine', 0.4, 660); }
};

/* ================= state ================= */
var state = 'menu'; // menu | options | playing | gameover
var paused = false;
var score = 0, lives = 3, level = 1, combo = 0;
var ball = { x:0, y:0, vx:0, vy:0, r:8, stuck:true };
var paddle = { x:0, w:96, h:14, y:0, targetX:null };
var bricks = [];
var particles = [];
var trail = [];
var banner = null;
var shake = 0;

var BRICK_TONES = ['#221E18','#2B251C','#342E21','#3D3727','#463F2D','#4F4834','#58513B','#615843'];
var INK = '#1E1B16', GOLD = '#A8822F';
var FIELD = { top: 96, side: 14, gap: 6, cols: 7 };

function layoutField(){
  paddle.w = DIFFS[difficulty].paddleW;
  paddle.y = H - 90;
  var half = paddle.w/2;
  paddle.x = Math.min(Math.max(paddle.x || W/2, half), W - half);
}
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutField();
  if (state === 'playing' && bricks.length) buildLevel(level);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

function buildLevel(lv){
  bricks = [];
  var rows = Math.min(4 + lv - 1, 8);
  var availW = W - FIELD.side*2;
  var bw = (availW - FIELD.gap*(FIELD.cols-1)) / FIELD.cols;
  var bh = 24;
  for (var r = 0; r < rows; r++){
    for (var c = 0; c < FIELD.cols; c++){
      var hp = 1;
      if (lv >= 3 && (r + c) % 5 === 0) hp = 2;
      if (lv >= 5 && (r*7 + c) % 9 === 0) hp = 3;
      bricks.push({
        x: FIELD.side + c*(bw + FIELD.gap),
        y: FIELD.top + r*(bh + FIELD.gap),
        w: bw, h: bh,
        hp: hp, maxHp: hp,
        color: BRICK_TONES[r % BRICK_TONES.length]
      });
    }
  }
}
function resetBall(){
  ball.stuck = true;
  ball.x = paddle.x; ball.y = paddle.y - paddle.h/2 - ball.r - 2;
  ball.vx = 0; ball.vy = 0;
  trail = [];
}
function launch(){
  if (!ball.stuck || state !== 'playing') return;
  var sp = DIFFS[difficulty].ballSpeed * (1 + (level-1)*0.07);
  var a = -Math.PI/2 + (Math.random()*0.6 - 0.3);
  ball.vx = sp * Math.cos(a); ball.vy = sp * Math.sin(a);
  ball.stuck = false;
  sfx.launch();
}
function startGame(){
  score = 0; lives = 3; level = 1; combo = 0; particles = []; paused = false;
  paddle.x = W/2; paddle.targetX = null;
  buildLevel(1);
  resetBall();
  state = 'playing';
  hideOverlay();
  showBanner('LEVEL 1');
}
function nextLevel(){
  level++; combo = 0;
  buildLevel(level);
  resetBall();
  showBanner('LEVEL ' + level);
  sfx.clear();
}
function gameOver(){
  state = 'gameover';
  if (score > best){ best = score; store.set('best', String(best)); }
  sfx.over();
  showGameOver();
}
function loseLife(){
  lives--; combo = 0; shake = 12;
  sfx.lose();
  if (lives <= 0) gameOver();
  else { resetBall(); showBanner('BALL LOST'); }
}
function showBanner(text){ banner = { text: text, until: performance.now() + 1400 }; }
function burst(x, y, color){
  for (var i = 0; i < 10; i++){
    var a = Math.random()*Math.PI*2, sp = 60 + Math.random()*160;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0.5 + Math.random()*0.3, t:0, color:color, r:2 + Math.random()*3 });
  }
}

/* ================= update ================= */
var lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  var dt = Math.min((t - lastT)/1000, 0.033);
  lastT = t;
  if (state === 'playing' && !paused) update(dt);
  updateFx(dt);
  render();
}
function update(dt){
  if (paddle.targetX !== null){
    var half = paddle.w/2;
    var want = Math.min(Math.max(paddle.targetX, half), W - half);
    paddle.x += (want - paddle.x) * Math.min(1, dt*18);
  }
  if (ball.stuck){
    ball.x = paddle.x; ball.y = paddle.y - paddle.h/2 - ball.r - 2;
    return;
  }
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 14) trail.shift();

  // walls
  if (ball.x - ball.r < 0){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); sfx.wall(); }
  if (ball.x + ball.r > W){ ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
  if (ball.y - ball.r < FIELD.top - 40){ ball.y = FIELD.top - 40 + ball.r; ball.vy = Math.abs(ball.vy); sfx.wall(); }

  // paddle
  if (ball.vy > 0 &&
      ball.y + ball.r >= paddle.y - paddle.h/2 &&
      ball.y + ball.r <= paddle.y + paddle.h/2 + 14 &&
      Math.abs(ball.x - paddle.x) <= paddle.w/2 + ball.r){
    var rel = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w/2)));
    var sp = Math.hypot(ball.vx, ball.vy);
    var ang = -Math.PI/2 + rel * (Math.PI/3);
    ball.vx = sp * Math.cos(ang);
    ball.vy = sp * Math.sin(ang);
    if (ball.vy > -sp*0.25) ball.vy = -sp*0.25;
    ball.y = paddle.y - paddle.h/2 - ball.r - 1;
    combo = 0;
    sfx.paddle();
  }

  // bricks (one per frame)
  for (var i = bricks.length - 1; i >= 0; i--){
    var b = bricks[i];
    if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w ||
        ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;
    var dxL = (ball.x + ball.r) - b.x, dxR = (b.x + b.w) - (ball.x - ball.r);
    var dyT = (ball.y + ball.r) - b.y, dyB = (b.y + b.h) - (ball.y - ball.r);
    var m = Math.min(dxL, dxR, dyT, dyB);
    if (m === dxL){ ball.x = b.x - ball.r; ball.vx = -Math.abs(ball.vx); }
    else if (m === dxR){ ball.x = b.x + b.w + ball.r; ball.vx = Math.abs(ball.vx); }
    else if (m === dyT){ ball.y = b.y - ball.r; ball.vy = -Math.abs(ball.vy); }
    else { ball.y = b.y + b.h + ball.r; ball.vy = Math.abs(ball.vy); }
    b.hp--;
    if (b.hp <= 0){
      bricks.splice(i, 1);
      burst(ball.x, ball.y, b.color);
      combo++;
      score += 10 * b.maxHp + Math.min(combo, 10) * 2;
      sfx.brick(combo);
    } else {
      sfx.hard();
    }
    break;
  }

  if (bricks.length === 0){ nextLevel(); return; }
  if (ball.y - ball.r > H + 20) loseLife();
}
function updateFx(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.t += dt;
    if (p.t >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
  }
  if (shake > 0) shake = Math.max(0, shake - dt*40);
}

/* ================= render ================= */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function render(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#FBF9F5'); g.addColorStop(1, '#F0EAE0');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W+40, H+40);
  ctx.shadowBlur = 0;

  if (state === 'playing' || state === 'gameover'){
    var i, b;
    for (i = 0; i < bricks.length; i++){
      b = bricks[i];
      ctx.globalAlpha = 0.35 + 0.65 * (b.hp / b.maxHp);
      ctx.shadowColor = 'rgba(30,27,22,0.18)'; ctx.shadowBlur = 6;
      ctx.fillStyle = b.color;
      rr(b.x, b.y, b.w, b.h, 5); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      if (b.maxHp > 1){
        ctx.fillStyle = GOLD;
        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(b.hp), b.x + b.w/2, b.y + b.h/2 + 1);
      }
    }
    for (i = 0; i < trail.length; i++){
      var tp = trail[i], ta = i / trail.length;
      ctx.globalAlpha = ta * 0.22;
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(tp.x, tp.y, ball.r * ta, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // paddle
    ctx.save();
    ctx.shadowColor = 'rgba(30,27,22,0.28)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.fillStyle = INK;
    rr(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, paddle.h, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(247,244,238,.35)';
    rr(paddle.x - paddle.w/2 + 8, paddle.y - paddle.h/2 + 3, paddle.w - 16, 3, 1.5); ctx.fill();
    // ball
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    // particles
    for (i = 0; i < particles.length; i++){
      var p = particles[i];
      ctx.globalAlpha = 1 - p.t/p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // HUD
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    if (state === 'playing' && !paused){
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(26, 32, 15, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = INK;
      ctx.fillRect(20, 25, 4, 14); ctx.fillRect(28, 25, 4, 14);
    }
    ctx.fillStyle = INK; ctx.font = '800 20px sans-serif';
    ctx.fillText(String(score), 52, 34);
    ctx.textAlign = 'center';
    ctx.fillStyle = GOLD; ctx.font = '700 13px sans-serif';
    ctx.fillText('BEST ' + best, W/2, 32);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(30,27,22,.55)';
    ctx.fillText('LV ' + level, W - 16, 32);
    ctx.textAlign = 'left'; ctx.font = '15px sans-serif';
    var dots = '';
    for (var li = 0; li < lives; li++) dots += '●';
    ctx.fillStyle = GOLD;
    ctx.fillText(dots, 52, 58);
    if (ball.stuck && state === 'playing'){
      ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(30,27,22,.55)';
      ctx.font = '700 15px sans-serif';
      ctx.fillText('TAP TO LAUNCH', W/2, H - 160);
    }
    if (banner && performance.now() < banner.until){
      ctx.textAlign = 'center';
      ctx.font = '800 38px sans-serif';
      ctx.fillStyle = INK;
      ctx.fillText(banner.text, W/2, H/2);
    } else banner = null;
  }
  ctx.restore();
}

/* ================= menus ================= */
function hideOverlay(){ overlayEl.classList.add('hidden'); }
function showOverlay(html){
  overlayEl.innerHTML = html;
  overlayEl.classList.remove('hidden');
  wireButtons();
}
function showMenu(){
  state = 'menu';
  showOverlay(
    '<h1>BREAKOUT</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">SMASH EVERY BRICK</div>' +
    '<button class="btn solid" data-act="start">START</button>' +
    '<button class="btn" data-act="options">OPTIONS</button>' +
    '<button class="btn" data-act="exit">EXIT</button>' +
    '<div id="stat">BEST <b>' + best + '</b></div>'
  );
}
function showOptions(){
  state = 'options';
  showOverlay(
    '<h1 style="font-size:32px">OPTIONS</h1>' +
    '<div class="sub">TUNE YOUR GAME</div>' +
    '<div class="opt-row"><span class="label">SOUND</span>' +
      '<button class="val" data-act="sound">' + (soundOn ? 'ON' : 'OFF') + '</button></div>' +
    '<div class="opt-row"><span class="label">DIFFICULTY</span>' +
      '<button class="val" data-act="diff">' + DIFFS[difficulty].label + '</button></div>' +
    '<button class="btn" data-act="menu" style="margin-top:22px">BACK</button>'
  );
}
function showGameOver(){
  showOverlay(
    '<h1 style="font-size:34px">GAME OVER</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">LEVEL ' + level + ' REACHED</div>' +
    '<div id="stat" style="font-size:20px; margin-bottom:14px">SCORE <b>' + score + '</b><br>BEST <b>' + best + '</b></div>' +
    '<button class="btn solid" data-act="start">RETRY</button>' +
    '<button class="btn" data-act="menu">MENU</button>'
  );
}
function showPause(){
  paused = true;
  showOverlay(
    '<h1 style="font-size:32px">PAUSED</h1>' +
    '<div class="rule"></div>' +
    '<div class="sub">TAKE A BREATHER</div>' +
    '<button class="btn solid" data-act="resume">RESUME</button>' +
    '<button class="btn" data-act="menu">MENU</button>' +
    '<button class="btn" data-act="home">HOME</button>'
  );
}
function wireButtons(){
  var btns = overlayEl.querySelectorAll('[data-act]');
  for (var i = 0; i < btns.length; i++){
    (function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var a = b.getAttribute('data-act');
        if (a === 'start') startGame();
        else if (a === 'options') showOptions();
        else if (a === 'menu'){ paused = false; showMenu(); }
        else if (a === 'exit') window.location.href = 'index.html';
        else if (a === 'home') window.location.href = 'index.html';
        else if (a === 'resume'){ paused = false; hideOverlay(); }
        else if (a === 'sound'){
          soundOn = !soundOn; store.set('sound', soundOn ? 'on' : 'off');
          showOptions(); if (soundOn) sfx.launch();
        }
        else if (a === 'diff'){
          difficulty = difficulty === 'easy' ? 'normal' : difficulty === 'normal' ? 'hard' : 'easy';
          store.set('diff', difficulty); showOptions();
        }
      });
    })(btns[i]);
  }
}

/* ================= input ================= */
function pointerX(e){
  if (e.touches && e.touches.length) return e.touches[0].clientX;
  return e.clientX;
}
function pointerY(e){
  if (e.touches && e.touches.length) return e.touches[0].clientY;
  return e.clientY;
}
function onDown(e){
  audio();
  if (state === 'playing' && !paused && pointerX(e) < 58 && pointerY(e) < 66){
    showPause(); e.preventDefault(); return;
  }
  if (paused) return;
  if (state === 'playing'){
    paddle.targetX = pointerX(e);
    if (ball.stuck) launch();
  }
  e.preventDefault();
}
function onMove(e){
  if (state === 'playing' && !paused && (e.touches || e.buttons)){
    paddle.targetX = pointerX(e);
  }
  if (e.cancelable) e.preventDefault();
}
canvas.addEventListener('touchstart', onDown, { passive:false });
canvas.addEventListener('touchmove', onMove, { passive:false });
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if (state !== 'playing') return;
  var step = 26;
  var cur = paddle.targetX === null ? paddle.x : paddle.targetX;
  if (e.key === 'ArrowLeft') paddle.targetX = Math.max(paddle.w/2, cur - step);
  else if (e.key === 'ArrowRight') paddle.targetX = Math.min(W - paddle.w/2, cur + step);
  else if (e.key === ' ' || e.key === 'Enter'){ if (ball.stuck) launch(); }
});

/* ================= boot ================= */
resize();
paddle.x = W/2;
showMenu();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
